document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b || b.disabled) return;
  var act = b.dataset.act;
  switch (act) {
    case 'tab': go(b.dataset.tab); break;
    case 'dlg-cancel': closeDialog(); break;
    case 'dlg-ok': { var f = dlg && dlg.onOk; var keep = f ? f() === false : false; if (!keep) closeDialog(); break; }
    case 'add-athlete': if (!ro()) addAthlete(true); break;
    case 'del-athlete': {
      if (ro()) break;
      var id = b.dataset.aid, a = findAth(id);
      if (athHasEntries(id)) confirmDlg('Remove athlete?', 'Remove ' + esc(a ? athLabel(a) : 'this athlete') + '? Their paddles and red cards from every judge are removed too.', 'Remove athlete', function(){ delAthlete(id); });
      else delAthlete(id);
      break;
    }
    case 'paste': if (!ro()) openPaste(); break;
    case 'sample':
      if (ro()) break;
      if (S.event.athletes.length || hasAnyEntries()) confirmDlg('Replace with sample race?', 'This replaces the athletes, officials and every judge&rsquo;s entries' + (inHeats() ? ' for ' + esc(raceLabel(S.raceId)) : '') + ' on all devices with a sample race.', 'Load sample', loadSample);
      else loadSample();
      break;
    case 'clear-all':
      if (ro()) break;
      confirmDlg('Clear all judge entries?', 'This clears every judge&rsquo;s paddles and red cards, and any Penalty Zone countdowns, for all athletes' + (inHeats() ? ' in ' + esc(raceLabel(S.raceId)) + ' only' : '') + ', on every device. Use it before a new race. The athletes and officials stay.', 'Clear entries', clearAll);
      break;
    case 'clear-judge': {
      if (roEnt()) break;
      var n = +b.dataset.n;
      confirmDlg('Clear your entries?', 'This clears every yellow paddle and red card you recorded as Judge ' + n + '.', 'Clear my entries', function(){ clearJudge(n); });
      break;
    }
    case 'csv': exportCSV(); break;
    case 'pdf': openPdfDialog(b.dataset.k); break;
    case 'rc-sort': S.rcSort = b.dataset.v; render(); break;
    case 'rc-only': S.rcOnly = !S.rcOnly; render(); break;
    case 'pz-time': {
      if (roEnt()) break;
      ent(PZM, PZ_KEY).pzd = String(+b.dataset.v || 0);
      queueEntries(PZM, 100); render();
      break;
    }
    case 'pz-stamp': {
      if (roEnt()) break;
      var pza = b.dataset.aid, pzk = b.dataset.k, pze = ent(PZM, pza), pzn = Date.now();
      if (pzk === 'a') {
        if (pze.pza) { pzClearArrival(pza); break; }
        if (!raceOpen()) { toast('The race must be open to record an arrival.'); break; }
        if (!pzTime()) { toast('Choose a countdown time first.'); break; }
        pze.pza = String(pzn); pze.pzd = String(pzTime()); pze.pzr = ''; pze.pzv = '';
        queueEntries(PZM, 60); render();
      } else if (pze.pzr) {
        if (pzLocked()) { toast('The race is closed, so this cannot be cleared. Reopen the race to make corrections.'); break; }
        pze.pzr = ''; pze.pzv = ''; queueEntries(PZM, 60); render();
      } else if (pze.pza) {
        if (pzState(pza, pzn).state === 'run') {
          var pzath = findAth(pza);
          confirmDlg('Release before the time is up?', 'The countdown for ' + esc(pzath ? athLabel(pzath) : 'this athlete') + ' has not finished. Release them anyway? They will be marked Penalty Served.', 'Release', function(){ pzRelease(pza, Date.now()); });
        } else pzRelease(pza, pzn);
      }
      break;
    }
    case 'pz-served': {
      if (roEnt()) { b.checked = !b.checked; break; }
      var svAid = b.dataset.aid, sve = ent(PZM, svAid);
      if (sve.pzv) {
        if (pzLocked()) { b.checked = true; toast('The race is closed, so this cannot be unmarked. Reopen the race to make corrections.'); break; }
        sve.pzv = ''; queueEntries(PZM, 60); render(); break;   // unchecking: just clear the served flag, keep any release time as-is
      }
      if (!sve.pza) { b.checked = false; toast('Record the arrival first.'); break; }
      if (sve.pzr) { sve.pzv = '1'; queueEntries(PZM, 60); render(); break; }  // a release time is already recorded: just mark it served, without changing that time
      if (pzState(svAid, Date.now()).state === 'run') {
        b.checked = false;   // put the checkbox back to unchecked until this is confirmed; a render() here would not touch it, since nothing in the app's own state has changed yet
        var svA = findAth(svAid);
        confirmDlg('Release before the time is up?', 'The countdown for ' + esc(svA ? athLabel(svA) : 'this athlete') + ' has not finished. Release them now anyway?', 'Release', function(){ pzRelease(svAid, Date.now()); });
      } else pzRelease(svAid, Date.now());
      break;
    }
    case 'pz-add-time': {
      if (roEnt()) { b.checked = !b.checked; break; }
      var atAid = b.dataset.aid, ate = ent(PZM, atAid);
      if (ate.pzAddFlag) {
        if (pzLocked()) { b.checked = true; toast('The race is closed, so this cannot be unmarked. Reopen the race to make corrections.'); break; }
        ate.pzAddFlag = ''; queueEntries(PZM, 60); render(); break;
      }
      ate.pzAddFlag = '1'; queueEntries(PZM, 60);
      timerEntryFor(atAid).rule = String(PZ_ADD_RULE_IDX); queueRace(60);   // pre-selects "230.3J - PZ Time Added After Race" specifically, not the other rule sharing that same number
      render();
      break;
    }
    case 'pz-preset': {
      if (ro()) break;
      if (S.event.pit > 0) S.event.dq = S.event.pit + 1; else { S.event.pit = 3; if (S.event.dq <= 3) S.event.dq = 4; }
      queueRace(200); render();
      break;
    }
    case 'pz-opt': {
      if (ro()) break;
      S.event.usePZ = !S.event.usePZ;
      queueMeet(200); render();
      b.checked = S.event.usePZ;
      break;
    }
    case 'timer-opt': {
      if (ro()) break;
      S.event.useTimer = !S.event.useTimer;
      queueMeet(200); render();
      b.checked = S.event.useTimer;
      break;
    }
    case 'timer-info-stamp': {
      if (roEnt()) break;
      S.event.timerInfo.startTime = S.event.timerInfo.startTime ? '' : nowNum();
      queueRace(200); render();
      break;
    }
    case 'timer-pdf': exportTimerPDF(); break;
    case 'dq-id': {
      if (ro()) break;
      S.event.dqId = b.dataset.v;
      queueMeet(200); render();
      break;
    }
    case 'id-opt': {
      if (ro()) break;
      var idk = b.dataset.v === 'hip' ? 'useHip' : 'useBib', idother = idk === 'useHip' ? 'useBib' : 'useHip';
      var idwant = !S.event[idk];
      if (!idwant && !S.event[idother]) { b.checked = true; toast('Keep at least one selected: hip # or bib #.'); break; }
      S.event[idk] = idwant;
      queueMeet(200); render();
      b.checked = S.event[idk];
      break;
    }
    case 'race-mode': {
      if (ro()) break;
      S.event.raceMode = b.dataset.v === 'heats' ? 'heats' : 'combined';
      queueMeet(200);
      if (!syncRace()) render();
      b.checked = S.event.raceMode === b.dataset.v;   // keep exactly one option checked
      break;
    }
    case 'meet-type': {
      if (ro()) break;
      var nt = b.dataset.v === S.event.meetType ? '' : b.dataset.v;     // selecting the chosen type again clears it
      var oldList = divOptions(S.event.meetType), newList = divOptions(nt);
      for (var di = 0; di < MAXDIV; di++) {
        var dd = S.event.divisions[di];
        if (oldList.indexOf(dd.name) >= 0 && newList.indexOf(dd.name) < 0 && nt) dd.name = '';   // a pick from the other organization's list no longer applies
      }
      S.event.meetType = nt;
      queueMeet(200); render();
      b.checked = S.event.meetType === b.dataset.v;
      break;
    }
    case 'off-exit': exitOfficial(); break;
    case 'other-device-dismiss': presenceDismissSid = presenceOtherSid; S.otherDevice = 0; render(); break;
    case 'code-dialog': openCodeDialog(); break;
    case 'rename-account': openRenameDialog(); break;
    case 'board-code-dialog': openBoardCodeDialog(); break;
    case 'qr-toggle': S.qrOpen = !S.qrOpen; if (S.qrOpen) ensureCodes(); render(); break;
    case 'qr-copy': {
      var qel = $('#qr-link'); if (!qel) break;
      qel.focus(); qel.select();
      var done = function(){ toast('Link copied.'); }, fail = function(){ toast('Select the link and copy it.'); };
      try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(qel.value).then(done, function(){ try { document.execCommand('copy') ? done() : fail(); } catch(e){ fail(); } }); else document.execCommand('copy') ? done() : fail(); }
      catch (e) { fail(); }
      break;
    }
    case 'new-codes':
      if (ro()) break;
      confirmDlg('Create new codes?', 'This replaces the code for all nine judges. Every earlier QR code and typed code stops working, including on devices that are using one now.', 'Create new codes', function(){ replaceCodes(); render(); toast('New codes created.'); });
      break;
    case 'import-pick': { var pf = $('#imp-file'); if (pf) pf.click(); break; }
    case 'dq-toggle': S.dqOpen = !S.dqOpen; render(); break;
    case 'dq-copy': { var dqi = $('#dq-link'); if (dqi) { dqi.select(); try { document.execCommand('copy'); } catch(e){} try { navigator.clipboard && navigator.clipboard.writeText(dqi.value); } catch(e){} toast('Link copied.'); } break; }
    case 'export-meet': exportMeet(); break;
    case 'go-admin': goAdmin(); break;
    case 'admin-back': adminBack(); break;
    case 'admin-open': adminOpenAccount(b.dataset.id); break;
    case 'admin-toggle-admin': adminSetAdmin(b.dataset.id, b.dataset.v === '1'); break;
    case 'admin-toggle-suspend': {
      var susOn = b.dataset.v === '1';
      if (susOn) confirmDlg('Suspend this account?', 'They keep read access to their own meets, but cannot change them, start a new one, or give out new codes, until you lift the suspension.', 'Suspend', function(){ adminSetSuspended(b.dataset.id, true); });
      else adminSetSuspended(b.dataset.id, false);
      break;
    }
    case 'admin-clear-errlog': confirmDlg('Clear this account\u2019s access log?', 'This removes what is currently shown. It cannot be undone.', 'Clear log', function(){ adminClearErrlog(b.dataset.id); }); break;
    case 'admin-archive-meet': confirmDlg('Archive ' + esc(b.dataset.name) + '?', 'It becomes read-only for everyone, including officials. It can be restored at any time.', 'Archive meet', function(){ adminArchiveMeet(b.dataset.uid, b.dataset.id, true); }); break;
    case 'admin-restore-meet': adminArchiveMeet(b.dataset.uid, b.dataset.id, false); break;
    case 'admin-reset-codes': confirmDlg('Create new codes?', 'This replaces the code for every official on this meet. Every earlier QR code and typed code stops working, including on devices using one right now.', 'Create new codes', function(){ adminResetCodes(b.dataset.uid, b.dataset.id); }); break;
    case 'admin-open-meet': S.fromAdmin = true; LS.set(KEY + 'official', ''); openMeet(b.dataset.uid, b.dataset.id); break;
    case 'admin-export': adminExportCsv(); break;
    case 'signup': signUp(); break;
    case 'send-link': {
      var em = ($('#si-email') || {}).value || ''; em = em.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { toast('Enter a valid email address.'); break; }
      U.auth.sendLink(em).then(function(){ S.linkSent = em; render(); }, function(){ toast('The email could not be sent. Check the address and try again.'); });
      break;
    }
    case 'link-again': S.linkSent = ''; render(); break;
    case 'auth-tab': S.authTab = b.dataset.v; render(); break;
    case 'pw-create': {
      var emC = ($('#si-email') || {}).value || ''; emC = emC.trim();
      var pwC = ($('#si-pw') || {}).value || '', pwC2 = ($('#si-pw2') || {}).value || '';
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(emC)) { toast('Enter a valid email address.'); break; }
      if (pwC.length < 6) { toast('Use a password with at least 6 characters.'); break; }
      if (pwC !== pwC2) { toast('The two passwords do not match.'); break; }
      U.auth.signUpPassword(emC, pwC).then(function(uid){ return startAccounts(U, uid); }, function(e){ toast(e.friendly || 'Could not create that account.'); });
      break;
    }
    case 'pw-signin': {
      var emI = ($('#si-email') || {}).value || ''; emI = emI.trim();
      var pwI = ($('#si-pw') || {}).value || '';
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(emI)) { toast('Enter a valid email address.'); break; }
      if (!pwI) { toast('Enter your password.'); break; }
      U.auth.signInPassword(emI, pwI).then(function(uid){ return startAccounts(U, uid); }, function(e){ toast(e.friendly || 'Could not sign in.'); });
      break;
    }
    case 'pw-forgot': {
      var emF = ($('#si-email') || {}).value || ''; emF = emF.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(emF)) { toast('Enter your email address first.'); break; }
      // Always the same message, whether or not that address actually has a password-based account, so this cannot be used to check who has signed up.
      U.auth.resetPassword(emF).then(function(){ toast('If that email has a password set, a reset link was sent.'); }, function(){ toast('If that email has a password set, a reset link was sent.'); });
      break;
    }
    case 'sign-out': signOutNow(); break;
    case 'new-meet': if (S.canWrite && !S.suspended) openNewMeetDialog(); break;
    case 'open-meet': if (S.acct) { LS.set(KEY + 'official', ''); openMeet(S.acct.uid, b.dataset.id); } break;
    case 'home': if (S.acct) goHome(); break;
    case 'archive-meet': case 'restore-meet': {
      var lm = S.meets.filter(function(m){ return m.id === b.dataset.id; })[0]; if (!lm || !S.canWrite) break;
      if (b.dataset.act === 'restore-meet') { setListedArchived(lm, false); break; }
      confirmDlg('Archive ' + (lm.name || 'this meet') + '?', 'It moves to Archived meets and becomes read-only for everyone, including officials. You can restore it at any time.', 'Archive meet', function(){ setListedArchived(lm, true); });
      break;
    }
    case 'archive-current': confirmDlg('Archive this meet?', 'It moves to Archived meets and becomes read-only for everyone, including officials. You can restore it at any time.', 'Archive meet', function(){ setCurrentArchived(true); }); break;
    case 'restore-current': setCurrentArchived(false); break;
    case 'import-legacy': importLegacy(); break;
    case 'race-status': setRaceStatus(b.dataset.v); break;
    case 'race': selectRace(b.dataset.id); break;
    case 'copy-race': {
      if (ro()) break;
      var src = S.copySrc;
      if (!validRace(src)) { toast('Choose a race to copy from.'); break; }
      confirmDlg('Copy from ' + raceLabel(src) + '?', 'This replaces the recorder, officials, judges on or off and red card counts for ' + esc(raceLabel(S.raceId)) + ' with those from ' + esc(raceLabel(src)) + '. Athletes and judge entries are not changed.', 'Copy', function(){ copyRace(src); });
      break;
    }
    case 'supervisory': {
      if (ro()) break;
      S.event.supervisory = !S.event.supervisory;
      if (S.event.supervisory) S.event.last100 = false;      // the last 100m card is only a separate option for a Chief Judge who is judging
      queueRace(200); render();
      b.checked = S.event.supervisory;
      break;
    }
    case 'last100': {
      if (ro() || isSupervisory()) { b.checked = l100On(); break; }
      S.event.last100 = !S.event.last100;
      queueRace(200); render();
      b.checked = l100On();
      break;
    }
    case 'toggle-judge': {
      if (ro()) break;
      var tn = +b.dataset.n;
      if (isPZM(tn) && !usePZ()) break;                  // needs Penalty Zone turned on first
      if (tn <= NMAIN && isActive(tn) && activeList().length <= MIN_JUDGES) { toast('At least ' + MIN_JUDGES + ' judges are required for a race.'); break; }   // even if forced through (stale-render edge case)
      S.event.active[tn - 1] = isPZM(tn) ? S.event.active[tn - 1] !== true : !isActive(tn);
      queueRace(200); render();
      break;
    }
    case 'stamp': {
      if (roEnt() || !isActive(+b.dataset.n) || !raceOpen()) break;
      var jn = +b.dataset.n, aidS = b.dataset.aid, k = b.dataset.k, en = ent(jn, aidS);
      if (k === 'y1' || k === 'y2') {
        if (en[k + 'Lock']) break;   // locked: handled by case 'call-unlock' instead
        var athS = findAth(aidS), labS = k === 'y1' ? 'Yellow \u2014 Bent knee' : 'Yellow \u2014 Loss of contact', whoS = esc(athS ? athLabel(athS) : 'this athlete');
        if (en[k]) {
          confirmDlg('Clear this call?', 'Clear ' + esc(labS) + ' for ' + whoS + '. This call has not been locked yet.', 'Clear', function(){ en[k] = ''; queueEntries(jn, 60); render(); });
        } else {
          var whenS = nowNum();
          confirmCallDlg(esc(labS) + ' for ' + whoS + ', at ' + fmtEnt(whenS) + '. Once confirmed, this call locks and cannot be changed without unlocking it first.', function(){ en[k] = whenS; en[k + 'Lock'] = '1'; queueEntries(jn, 60); render(); });
        }
        break;
      }
      if ((k === 'rt' && en.rcLock) || (k === 'lt' && en.lcLock)) break;   // recorded with the red card; change it by unlocking that card instead
      en[k] = en[k] ? '' : nowNum();
      queueEntries(jn, 120); render();
      break;
    }
    case 'rc': {
      if (roEnt() || !isActive(+b.dataset.n) || !raceOpen()) break;
      var jn2 = +b.dataset.n, aidR = b.dataset.aid, kR = b.dataset.k === 'lc' ? 'lc' : 'rc', enR = ent(jn2, aidR);
      if (enR[kR + 'Lock']) break;   // locked: handled by case 'call-unlock' instead
      var athR = findAth(aidR), whoR = esc(athR ? athLabel(athR) : 'this athlete');
      var labR = kR === 'lc' ? 'Last 100m red card' : 'Red card', valR = b.dataset.v, choiceR = valR === '>' ? 'Bent knee' : valR === '~' ? 'Loss of contact' : 'None';
      var rtKeyR = kR === 'lc' ? 'lt' : 'rt', whenR = valR ? nowNum() : '';   // a real card records its own time of day automatically; choosing None does not
      confirmCallDlg(labR + ': ' + choiceR + (whenR ? ', at ' + fmtEnt(whenR) : '') + ', for ' + whoR + '. Once confirmed, this call locks and cannot be changed without unlocking it first.', function(){
        enR[kR] = valR; enR[kR + 'Lock'] = '1'; if (whenR) enR[rtKeyR] = whenR; queueEntries(jn2, 60); render();
      });
      break;
    }
    case 'call-unlock': {
      if (roEnt() || !isActive(+b.dataset.n) || !raceOpen()) break;
      var jnU = +b.dataset.n, aidU = b.dataset.aid, kU = b.dataset.k, enU = ent(jnU, aidU);
      var athU = findAth(aidU), whoU = esc(athU ? athLabel(athU) : 'this athlete');
      var rtKeyU = kU === 'rc' ? 'rt' : kU === 'lc' ? 'lt' : null;   // a red card's own time of day was set automatically with it, so removing or unlocking the call removes that time too
      confirmDlg('Unlock this call?', 'This lets ' + whoU + '\u2019s call be changed again. It locks again once a new call is confirmed.' + (rtKeyU ? ' Its time of day is cleared, since it was recorded with the call.' : ''), 'Unlock', function(){
        enU[kU + 'Lock'] = ''; if (rtKeyU) enU[rtKeyU] = ''; queueEntries(jnU, 60); render();
      });
      break;
    }
  }
});

document.addEventListener('input', function(e){
  var t = e.target;
  if (t.dataset && t.dataset.bind === 'pz') return;              // Penalty Zone times are committed when the box is left
  if (t.id === 'jq') { S.filter = t.value; renderJudgeList(); return; }
  if (t.id === 'admin-search') { S.adminSearch = t.value; var ui = captureUI(); render(); restoreUI(ui); return; }
  var b = t.dataset && t.dataset.bind;
  if (!b || (b === 'ent' ? roEnt() : ro())) return;
  var k = t.dataset.k;
  if (b === 'ev') {
    if (k === 'dq' || k === 'pit' || k === 'divCount' || k === 'boardRows') return;           // handled on change
    S.event[k] = t.value; qEv(k, 500);
    if (k === 'name' || k === 'date') renderHeader();
  } else if (b === 'div') {
    if (k === 'name') { S.event.divisions[+t.dataset.i].name = t.value; queueMeet(500); renderRaceBar(); }   // heats handled on change
  } else if (b === 'jd') {
    S.event.judges[+t.dataset.n - 1][k] = t.value; queueRace(500);
  } else if (b === 'ath') {
    var a = findAth(t.dataset.aid);
    if (a) { a[k] = t.value; queueRace(500); updateWarn(); }
  } else if (b === 'ent') {
    var n = +t.dataset.n, v = digits(t.value);
    if (!isActive(n) || !raceOpen()) return;
    if (v !== t.value) t.value = v;
    if (k === 'y1' || k === 'y2') return;   // typing this call is confirmed on change, below, not committed keystroke by keystroke
    ent(n, t.dataset.aid)[k] = v;
    queueEntries(n, 500); refreshRow(t);
  } else if (b === 'timerinfo') {
    if (roEnt()) return;
    if (k === 'startTime') { var tiv = digits(t.value); if (tiv !== t.value) t.value = tiv; S.event.timerInfo.startTime = tiv; queueRace(500); return; }
    S.event.timerInfo[k] = t.value; queueRace(500);
  }
});

document.addEventListener('change', function(e){
  var t = e.target;
  if (t.id === 'imp-file') { importFile(t); return; }
  if (t.dataset && t.dataset.bind === 'pz') { pzTyped(t); return; }
  if (t.dataset && t.dataset.bind === 'ent' && (t.dataset.k === 'y1' || t.dataset.k === 'y2')) {
    var nY = +t.dataset.n, kY = t.dataset.k, aidY = t.dataset.aid, enY = ent(nY, aidY), vY = digits(t.value);
    if (roEnt() || !isActive(nY) || !raceOpen() || enY[kY + 'Lock']) { t.value = enY[kY] || ''; return; }
    if (!vY) { t.value = enY[kY] || ''; return; }   // typing it blank does not clear a call; use the X button for that, which confirms first
    var athY = findAth(aidY), whoY = esc(athY ? athLabel(athY) : 'this athlete'), labY = kY === 'y1' ? 'Yellow \u2014 Bent knee' : 'Yellow \u2014 Loss of contact';
    t.value = enY[kY] || '';   // shows the confirmed value (or blank) until this is actually confirmed, below
    confirmCallDlg(esc(labY) + ' for ' + whoY + ', at ' + fmtEnt(vY) + '. Once confirmed, this call locks and cannot be changed without unlocking it first.', function(){
      enY[kY] = vY; enY[kY + 'Lock'] = '1'; queueEntries(nY, 60); render();
    });
    return;
  }
  if (t.dataset && t.dataset.bind === 'timerrow' && !roEnt()) {
    var tk = t.dataset.k;
    if (tk === 'rule' || tk === 'pzAdd') { timerEntryFor(t.dataset.aid)[tk] = t.value; queueRace(200); render(); }
    return;
  }
  if (t.dataset && t.dataset.bind === 'copysrc') { S.copySrc = t.value; return; }
  if (t.dataset && t.dataset.bind === 'divsel' && !ro()) {
    var dv = S.event.divisions[+t.dataset.i], pickv = t.value;
    if (pickv === '__custom__') dv.custom = true; else { dv.name = pickv; dv.custom = false; }
    queueMeet(200); render();
    if (pickv === '__custom__') { var ce = document.querySelector('[data-f="div:' + t.dataset.i + ':name"]'); if (ce) ce.focus(); }
    return;
  }
  if (t.dataset && t.dataset.bind === 'div' && t.dataset.k === 'heats' && !ro()) {
    S.event.divisions[+t.dataset.i].heats = toInt(t.value, 1, MAXHEATS, 1);
    t.value = S.event.divisions[+t.dataset.i].heats; queueMeet(200);
    if (!syncRace()) render();
    return;
  }
  if (!t.dataset || t.dataset.bind !== 'ev' || ro()) return;
  if (t.dataset.k === 'shareLink') { render(); return; }      // shows or clears the "not a web link" note
  if (t.dataset.k === 'divCount') { S.event.divCount = toInt(t.value, 1, MAXDIV, 2); t.value = S.event.divCount; queueMeet(200); if (!syncRace()) render(); return; }
  if (t.dataset.k === 'dq') { S.event.dq = toInt(t.value, 1, 9, 3); queueRace(200); render(); }
  else if (t.dataset.k === 'pit') { S.event.pit = toInt(t.value, 0, 9, 0); queueRace(200); render(); }
  else if (t.dataset.k === 'boardRows') { S.event.boardRows = boardRowsClamp(toInt(t.value, 0, 200, 0)); t.value = S.event.boardRows || ''; queueMeet(200); render(); }
});

document.addEventListener('keydown', function(e){
  var t = e.target;
  if (e.key === 'Escape' && dlg) { closeDialog(); return; }
  if (e.key === 'Tab' && dlg) {
    var f = $('#dialog-root').querySelectorAll('button, textarea, input');
    if (f.length) {
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  if (e.key === 'Enter' && t.dataset && t.dataset.bind === 'ath' && t.dataset.k === 'name' && !ro()) {
    var i = -1;
    S.event.athletes.forEach(function(a, idx){ if (a.id === t.dataset.aid) i = idx; });
    if (i === S.event.athletes.length - 1) { e.preventDefault(); addAthlete(true); }
  }
  if (e.key === 'Enter' && t.classList && t.classList.contains('tin')) t.blur();
});

window.addEventListener('hashchange', function(){
  var po = parseOfficial((location.hash || '').slice(1));
  if (po) { acceptOfficial(po); return; }
  var h = (location.hash || '').slice(1).split('/');
  if (h[1] && validRace(h[1]) && h[1] !== wantRace) { wantRace = h[1]; LS.set(KEY + 'race', wantRace); syncRace(); }
  if (h[0] && h[0] !== S.tab) go(h[0], true);
});
document.addEventListener('visibilitychange', function(){ if (document.hidden) flushAll(); });
window.addEventListener('pagehide', flushAll);
window.addEventListener('resize', fitGrid);

/* ================================================================
   Start
   ================================================================ */
(function init(){
  var h = ''; try { h = (location.hash || '').slice(1); } catch(e){}
  var saved = LS.get(KEY + 'tab');
  var hp = h.split('/'), po = parseOfficial(h), bo = parseBoard(h);
  S.tab = validTab(hp[0]) ? hp[0] : validTab(saved) ? saved : 'howto';
  wantRace = hp[1] || LS.get(KEY + 'race');
  if (po) { S.pendingOff = po; S.tab = tabFor(po.n); if (po.race) wantRace = po.race; }   // opened from a judge's QR code
  else if (bo) { S.pendingBoard = bo; S.board = true; }                                    // opened from the DQ Board link
  try {
    var mq = window.matchMedia('(max-width: 720px)');
    S.narrow = mq.matches;
    var onMq = function(e){ S.narrow = e.matches; render(); };
    if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
  } catch(e){}
  try { var cy = new Date().getFullYear(), el = $('#cyr'); if (el) el.textContent = cy > 2020 ? cy : 2020; } catch(e){}
  render();
  connect();
})();

})();
</script>
