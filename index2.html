<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Race Walk Officiating</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECEF; --surface:#FFFFFF; --surface-2:#F3F5F7;
  --ink:#111A22; --muted:#56626E; --line:#D2D8DE; --line-strong:#9AA6B2;
  --yellow:#F7C90D; --on-yellow:#1B1500; --yellow-soft:#FFF0A6; --yellow-ink:#4A3A00;
  --red:#C8261B; --on-red:#FFFFFF; --red-soft:#F8D3CF; --red-wash:#FDF1EF; --red-ink:#8E1A12;
  --live:#1B8553; --focus:#1F5FFF; --off-bg:#CBD1D8; --off-ink:#44505B;
  --blue:#1F5FD6; --blue-soft:#DCE8FF; --blue-ink:#123A8C; --green:#1B8553; --green-soft:#D7F2E3; --green-ink:#0F5A38; --orange:#C2570C; --orange-soft:#FFE6D0; --orange-ink:#7A3506; --on-st:#FFFFFF;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --w-hip:56px; --w-bib:56px; --w-name:184px; --w-cnt:124px;
  --w-y:62px; --w-rc:58px; --w-t:60px; --w-rc100:88px; --w-dn:88px;
  --h1:34px; --h2:38px; --h3:36px; --h4:34px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1116; --surface:#141B22; --surface-2:#1B242D;
    --ink:#E8EDF2; --muted:#98A5B2; --line:#26313B; --line-strong:#4A5967;
    --yellow:#F7C90D; --on-yellow:#1B1500; --yellow-soft:#3D3407; --yellow-ink:#FFE066;
    --red:#E5382B; --on-red:#FFFFFF; --red-soft:#4B1C18; --red-wash:#241513; --red-ink:#FF9B92;
    --live:#3CC383; --focus:#7AA5FF; --off-bg:#2C3742; --off-ink:#A9B4BF;
    --blue:#5B93FF; --blue-soft:#14284D; --blue-ink:#A9C7FF; --green:#3CC383; --green-soft:#0F3323; --green-ink:#8FE0B8; --orange:#F08A3A; --orange-soft:#452410; --orange-ink:#FFC08A; --on-st:#0C1116;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1116; --surface:#141B22; --surface-2:#1B242D;
  --ink:#E8EDF2; --muted:#98A5B2; --line:#26313B; --line-strong:#4A5967;
  --yellow:#F7C90D; --on-yellow:#1B1500; --yellow-soft:#3D3407; --yellow-ink:#FFE066;
  --red:#E5382B; --on-red:#FFFFFF; --red-soft:#4B1C18; --red-wash:#241513; --red-ink:#FF9B92;
  --live:#3CC383; --focus:#7AA5FF; --off-bg:#2C3742; --off-ink:#A9B4BF;
  --blue:#5B93FF; --blue-soft:#14284D; --blue-ink:#A9C7FF; --green:#3CC383; --green-soft:#0F3323; --green-ink:#8FE0B8; --orange:#F08A3A; --orange-soft:#452410; --orange-ink:#FFC08A; --on-st:#0C1116;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button[disabled],input[disabled]{cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Top bar ---------- */
.top{display:flex;flex-direction:column;gap:2px;padding:14px 16px 6px}
.top-row1{display:flex;align-items:center;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-by{font:400 13px/1 var(--sans);color:var(--muted);letter-spacing:0;white-space:nowrap}
.brand h1{margin:0;font:700 26px/1 var(--cond);letter-spacing:.01em}
.evline{display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;min-height:20px}
.ev-name{font:600 20px/1.1 var(--cond)}
.ev-date{color:var(--muted)}
.ev-none{color:var(--muted);font-size:15px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-size:14px;font-weight:600;white-space:nowrap}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.pill.live i{background:var(--live)}
.pill.save i{background:var(--yellow)}
.pill.err{border-color:var(--red);color:var(--red-ink)} .pill.err i{background:var(--red)}
.pill.boot i{background:var(--line-strong)}

/* ---------- Tabs ---------- */
.tabs{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px 16px 12px}
.tabrow{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:thin;max-width:100%}
.tabrow.judgerow{flex-wrap:wrap;overflow-x:visible}      /* the judges wrap onto a second line on a narrow screen instead of scrolling */
.tabs .judgerow .grp:first-child{margin-left:0;padding-left:0;border-left:0}
.tab{flex:none;min-height:44px;padding:0 16px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.tab:hover{border-color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.jt{min-width:44px;padding:0;justify-content:center;font:700 22px/1 var(--cond)}
.tabs .grp{flex:none;margin:0 2px 0 10px;padding-left:12px;border-left:2px solid var(--line-strong);color:var(--muted);font-weight:600;font-size:14px}
.rf-opts.pz-opt{margin-top:10px}
.rf-opts.pz-opt{border:none;padding:0;background:none}
.tab[disabled]{background:var(--off-bg);color:var(--off-ink);border-color:var(--off-bg);cursor:not-allowed}
.tab[disabled]:hover{border-color:var(--off-bg)}
.tab.jt.off{background:var(--off-bg);color:var(--off-ink);border-color:var(--off-bg)}
.tab.jt.off:hover{border-color:var(--line-strong)}
.tab.jt.off[aria-selected="true"]{background:var(--off-ink);color:var(--bg);border-color:var(--off-ink)}
.badge{background:var(--red);color:var(--on-red);border-radius:999px;font-size:13px;line-height:1;padding:3px 8px;font-weight:700}

.racebar{padding:0 16px 12px}
.racebar:empty{display:none}
.rb-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.rb-title{font-weight:600;color:var(--muted);font-size:14px;margin-right:2px}
.rb-grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 8px 5px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:100%;min-width:0}
.rb-name{font-weight:600;max-width:190px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-h{color:var(--muted);font-size:14px;margin-right:2px}
.rb{min-width:44px;height:44px;padding:0 6px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:700 22px/1 var(--cond)}
.rb:hover{border-color:var(--ink)}
.rb.st-up{background:var(--blue-soft);border:2px solid var(--blue);color:var(--blue-ink)}
.rb.st-open{background:var(--green-soft);border:2px solid var(--green);color:var(--green-ink)}
.rb.st-done{background:var(--orange-soft);border:2px solid var(--orange);color:var(--orange-ink)}
.rb.on{color:var(--on-st);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.rb.on.st-up{background:var(--blue);border-color:var(--blue)}
.rb.on.st-open{background:var(--green);border-color:var(--green)}
.rb.on.st-done{background:var(--orange);border-color:var(--orange)}
.rb-legend{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-left:4px;font-size:13px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.lg i,.ev-st i{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.lg.st-up{color:var(--blue)} .lg.st-open{color:var(--green)} .lg.st-done{color:var(--orange)}
.ev-st{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;border:1px solid;font-size:14px;font-weight:600;white-space:nowrap;max-width:100%;min-width:0}
.ev-st-r{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ev-st-s{flex:none}
.ev-st.st-up{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink)}
.ev-st.st-open{background:var(--green-soft);border-color:var(--green);color:var(--green-ink)}
.ev-st.st-done{background:var(--orange-soft);border-color:var(--orange);color:var(--orange-ink)}
.banner.st-up{background:var(--blue-soft);border-left-color:var(--blue);color:var(--blue-ink)}
.banner.st-done{background:var(--orange-soft);border-left-color:var(--orange);color:var(--orange-ink)}
.rstatus{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 12px}
.rs-title{font-weight:600;color:var(--muted);font-size:14px}
.rs-seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.rs-b{min-height:44px;padding:0 18px;border:0;border-left:1px solid var(--line-strong);background:var(--surface);font-weight:600}
.rs-b:first-child{border-left:0}
.rs-b:hover:not([disabled]):not([aria-pressed="true"]){background:var(--surface-2)}
.rs-b[aria-pressed="true"]{color:var(--on-st)}
.rs-b[aria-pressed="true"].st-up{background:var(--blue)}
.rs-b[aria-pressed="true"].st-open{background:var(--green)}
.rs-b[aria-pressed="true"].st-done{background:var(--orange)}
.rs-note{color:var(--muted);font-size:14px}
.race-note{margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.race-note p{margin:0 0 8px}
.copy-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.copy-row label{font-weight:600;font-size:14px;color:var(--muted)}
.copy-row select{height:42px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);max-width:100%;min-width:0}
.race-h{margin:2px 0 10px;font:700 26px/1.1 var(--cond)}
.jrace-line{margin:8px 0 0 !important}
.jrace{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600}
main{padding:0 16px 56px}

/* ---------- Generic controls ---------- */
.btn{min-height:42px;padding:0 16px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn:hover:not([disabled]){border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--red-ink);border-color:var(--red)}
.btn.danger-solid{background:var(--red);color:var(--on-red);border-color:var(--red)}
.btn[disabled]{opacity:.5}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rformat{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.rf-opts{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px 0 14px;border:2px solid var(--line-strong);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:600}
.chk input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--ink)}
.chk span{display:grid;line-height:1.2}
.chk small{color:var(--muted);font-weight:400;font-size:13px}
.chk:has(input:checked){border-color:var(--ink)}
.chk:has(input:disabled){cursor:not-allowed;opacity:.6}
.rf-div{margin-top:14px;display:grid;gap:12px}
.rf-count{max-width:220px}
.div-list{display:grid;gap:8px;max-width:780px}
.div-head,.div-row{display:grid;grid-template-columns:34px minmax(0,1fr) 150px;gap:8px 10px;align-items:end}
.div-head{color:var(--muted);font-weight:600;font-size:14px;margin-bottom:-2px}
.div-row .jchip{align-self:center}
.dn-name{display:grid;gap:6px;min-width:0}
.div-row select{width:100%;min-width:0;height:44px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.div-row select[disabled]{background:var(--surface-2)}
.mt-group .rf-note{margin-top:8px}
.div-row input{width:100%;min-width:0;height:44px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.div-row input[disabled]{background:var(--surface-2)}
.div-row .lab{display:none;font-weight:600;font-size:13px;color:var(--muted);margin-bottom:3px}
.rf-note{margin:0;color:var(--muted);font-size:14px;max-width:72ch}
.rf-opts + .rf-note{margin-top:10px}
.jpicker{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.jp-head{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.jp-title{font-weight:600;font-size:14px;color:var(--muted)}
.jp-count{font-weight:600}
.jp-row{display:flex;flex-wrap:wrap;gap:6px}
.jpick{width:48px;height:48px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink);font:700 24px/1 var(--cond)}
.jpick[aria-pressed="false"]{background:var(--off-bg);color:var(--off-ink);border-color:var(--off-bg)}
.jpick:hover:not([disabled]){border-color:var(--focus)}
.apick{min-width:56px;height:48px;padding:0 8px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink);font:700 20px/1 var(--cond)}
.apick[aria-pressed="false"]{background:var(--off-bg);color:var(--off-ink);border-color:var(--off-bg)}
.apick:hover:not([disabled]){border-color:var(--focus)}
.jp-sep{flex:none;width:16px}
.dq-id-opt{margin-top:6px}
.dq-id-note{margin-top:2px}
.board{height:100dvh;box-sizing:border-box;padding:28px 32px 20px;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
.board-logo{flex:none;text-align:center;margin-bottom:6px}
.board-logo svg{height:42px;width:auto}
.board-head{margin-bottom:26px}
.board-head h1{margin:0 0 6px;font:800 clamp(28px,4vw,52px)/1 var(--cond);letter-spacing:.02em}
.board-sub{font-size:clamp(15px,1.6vw,22px);color:var(--muted)}
.board-msg{margin-top:18vh;font-size:clamp(20px,3vw,32px);text-align:center;color:var(--muted)}
.board-head{flex:none}
.board-list{flex:1 1 auto;min-height:0;display:grid;grid-auto-flow:column;
  grid-template-rows:repeat(var(--board-rows,10),var(--board-row-h,60px));
  grid-template-columns:repeat(var(--board-cols,1),var(--board-col-w,300px));
  column-gap:16px;overflow-x:hidden;overflow-y:hidden}
.board-row{display:flex;align-items:center;gap:calc(var(--board-row-h,60px) * .16);padding-right:calc(var(--board-row-h,60px) * .16);border-bottom:1px solid var(--line);min-width:0;min-height:0;max-width:100%;max-height:100%;overflow:hidden}
.board-n{flex:none;min-width:2.2em;text-align:right;font:800 calc(var(--board-row-h,60px) * .52)/1 var(--cond);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.board-row.dq .board-n{color:var(--red-ink)}
.board-cards{flex:1 1 auto;display:flex;align-items:center;gap:calc(var(--board-row-h,60px) * .08);flex-wrap:nowrap;min-height:1em;min-width:0;overflow:hidden}
.chip-rc.board-chip{min-width:calc(var(--board-row-h,60px) * .6);height:calc(var(--board-row-h,60px) * .6);padding:0;font-size:calc(var(--board-row-h,60px) * .34);border-radius:calc(var(--board-row-h,60px) * .11)}
.board-status{flex:none;display:flex;gap:4px}
.app-foot{padding:10px 16px 16px;text-align:center;font-size:12px;color:var(--muted)}
.apick[disabled]{opacity:.5;cursor:not-allowed}
.apick.pzm{min-width:64px}
.pzm-line{display:flex;align-items:center;gap:10px;margin:8px 0}
.pz-times{margin:14px 0 10px}
.pz-opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.pz-opt{min-height:44px;padding:0 14px;border:2px solid var(--line-strong);border-radius:8px;background:var(--surface);font-weight:700}
.pz-opt:hover:not([disabled]){border-color:var(--ink)}
.pz-opt[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pz-opt[disabled]{opacity:.55;cursor:not-allowed}
.pz-h{margin:16px 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.pz-setup{margin:8px 0 12px}
.pzlist{list-style:none;margin:8px 0 4px;padding:0;display:grid;gap:8px}
.pz-n{display:flex;flex-direction:column;gap:8px}
.pzrow{display:grid;grid-template-columns:minmax(200px,1.2fr) auto 150px auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line-strong);border-radius:10px}
.pzrow.run,.pzrow.time{border-left-color:var(--ink)}
.pzrow.time{border-left-color:var(--ink)}
.pzrow.served{border-left-color:var(--green)}
.pzrow.dq{background:var(--red-soft);border-left-color:var(--red)}
.pz-who .jw{display:block}
.pz-meta{display:block;margin-top:2px;color:var(--muted);font-size:14px}
.pz-box{display:flex;gap:10px}
.pz-box .pz-tfld{flex:0 0 176px;min-width:176px}
.pz-tfld .tin{font-size:18px;padding:0 6px;letter-spacing:0}
.pz-in{font-variant-numeric:tabular-nums}
.pz-t{display:grid;justify-items:center;gap:4px;min-height:44px;align-content:center}
.pz-cd{display:inline-block;min-width:92px;padding:8px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-strong);text-align:center;font:700 30px/1 var(--cond);font-variant-numeric:tabular-nums}
.pz-cd.pz-warn{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
.pz-cd.done{background:var(--ink);color:var(--bg);border-color:var(--ink)}      /* time is up: not yellow, which is only for the last 10 seconds */
.pz-st,.pz-el{font-size:13px;color:var(--muted);text-align:center}
.pz-chk{white-space:nowrap}
@media (max-width:1100px){      /* not enough room for four columns: the athlete and Penalty Served on one line, then the times, then the countdown */
  .pzrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who served" "box box" "timer timer"}
  .pz-who{grid-area:who;min-width:0}
  .pz-n{grid-area:served}
  .pz-box{grid-area:box}
  .pz-t{grid-area:timer;display:flex;align-items:center;justify-content:flex-start;gap:12px;min-height:0}
  .pz-t:empty{display:none}
  .pz-st,.pz-el{text-align:left}
  .pz-box .pz-tfld{flex:1 1 0;min-width:0}
}
@media (max-width:720px){       /* phones: the athlete gets the full width, the countdown and Penalty Served share the last line */
  .pzrow{grid-template-areas:"who who" "box box" "timer served"}
}
@media (max-width:480px){
  .pzrow{grid-template-columns:minmax(0,1fr);grid-template-areas:"who" "box" "timer" "served"}
  .pz-box{flex-direction:column}
  .pz-box .pz-tfld{flex:none;width:100%}
  .pz-n .chk{width:100%}
}
}
.jn.ac{font-size:26px}
.jchip.ac{font-size:11px;letter-spacing:-.03em;padding:0 2px}
.jrow.ac{grid-template-columns:minmax(240px,1.3fr) minmax(200px,1fr)}
.jrow.ac.has-dn{border-left-color:var(--ink)}
.acm{display:inline-block;padding:0 5px;margin-right:4px;border-radius:4px;background:var(--ink);color:var(--bg);font:700 11px/16px system-ui,sans-serif;vertical-align:1px}
.pchip .acm{background:var(--bg);color:var(--ink);margin:0 0 0 4px}
.dni{display:block;white-space:nowrap}
.acn{display:block;margin-top:4px;color:var(--muted);font-size:13px}
.acnp{white-space:nowrap;margin-right:8px}
.jp-note{margin:8px 0 0;color:var(--muted);font-size:14px;max-width:72ch}
.banner{margin:0 0 12px;padding:10px 14px;border-left:5px solid var(--off-ink);background:var(--off-bg);color:var(--ink);border-radius:4px;font-weight:500}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.toolbar .sp{flex:1}
.warn{margin:0 0 10px;padding:8px 12px;border-left:5px solid var(--yellow);background:var(--yellow-soft);color:var(--yellow-ink);border-radius:4px;font-weight:500}
.warn[hidden]{display:none}

.band{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.fields + .fields{margin-top:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 16px}
.field label{display:block;font-weight:600;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;height:42px;padding:0 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
.field input[disabled]{background:var(--surface-2)}

/* ---------- Matrix (Recorder + Red Cards) ---------- */
.mx-wrap{overflow-x:auto;overflow-y:visible;border:1px solid var(--line);border-radius:10px;background:var(--surface)}      /* vertical scrolling is the page's own, not a separate region inside the table */
.mx-fit{overflow:hidden}      /* a single value on both axes: mixing hidden with visible here forces visible to compute as auto instead (a CSS quirk), and since a scale() transform never actually shrinks this element's own layout box (only how it paints), that coerced auto was finding a real, if purely cosmetic, overflow and drawing a scrollbar for it -- eating into the width meant for the last column */
.mx-scale{transform-origin:top left}
table.mx{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;font-size:14px}
.mx th,.mx td{padding:0 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-weight:400}
.mx tbody td{height:38px}
.mx thead th{position:sticky;z-index:3;font-size:12.5px;font-weight:600;color:var(--muted)}
.mx thead tr.r1 th{top:0;height:var(--h1)}
.mx thead tr.r2 th{top:var(--h1);height:var(--h2)}
.mx thead tr.r3 th{top:calc(var(--h1) + var(--h2));height:var(--h3)}
.mx thead tr.r4 th{top:calc(var(--h1) + var(--h2) + var(--h3));height:var(--h4);border-bottom:2px solid var(--ink)}
.mx th.lab{text-align:right;padding-right:10px}
.mx .l1,.mx .l2{position:sticky}
.mx.nohip .l2{left:0}
.mx .l1{left:0} .mx .l2{left:var(--w-hip)}
.mx tbody td.l1,.mx tbody td.l2,.mx tbody td.l3,.mx tbody td.l4{z-index:2}
.mx thead th.l1,.mx thead th.l2,.mx thead th.l3,.mx thead th.l4,.mx thead th.lab{z-index:5}
@media (min-width:900px){
  .mx .l3,.mx .l4,.mx th.lab{position:sticky}
  .mx .l3{left:calc(var(--w-hip) + var(--w-bib))}
  .mx .l4{left:calc(var(--w-hip) + var(--w-bib) + var(--w-name))}
  .mx th.lab{left:0}
  .mx td.tlab{left:0}
  .mx .l4{border-right:2px solid var(--ink)}
  .mx.nohip .l3{left:var(--w-bib)}
  .mx.nohip .l4{left:calc(var(--w-bib) + var(--w-name))}
  .mx.nobib .l3{left:var(--w-hip)}
  .mx.nobib .l4{left:calc(var(--w-hip) + var(--w-name))}
}
.mx .jstart{border-left:2px solid var(--line-strong)}
.mx .ga{background:var(--surface-2)}
.mx thead th.ga{background:var(--surface-2)}
.mx th.jh{color:var(--ink);font-size:14px}
.jh .jnum{font:700 22px/1 var(--cond);margin-right:8px}
.jh .role{font-weight:600;color:var(--muted)}
.mx thead th.hy{background:var(--yellow);color:var(--on-yellow)}
.mx thead th.hr{background:var(--red);color:var(--on-red)}
.mx thead th.hd{background:var(--ink);color:var(--bg)}
.mx thead th.h2{white-space:normal;line-height:1.05;font-size:12px;padding:0 3px}
.mx thead th.l4.rc-h{color:var(--ink)}
.recname{color:var(--ink) !important;font-weight:600 !important}
.tm{font-variant-numeric:tabular-nums;font-weight:600}
.mx td.on-y{background:var(--yellow-soft);color:var(--yellow-ink)}
.mx td.on-r{background:var(--red-soft)}
.chip-rc{display:inline-grid;place-items:center;min-width:28px;height:26px;padding:0 6px;border-radius:4px;background:var(--red);color:var(--on-red);font-weight:700;font-size:16px}
.mx td.cnt{font:700 22px/1 var(--cond)}
.mx td.cnt.zero{color:var(--muted);font-weight:500}
.mx td.cnt b{font-weight:700}
.stx{font:700 13px/1 var(--sans);font-style:normal;margin-left:8px;padding:4px 7px;border-radius:4px;vertical-align:middle}
.stx.dq{background:var(--red);color:var(--on-red)}
.stx.pit{background:var(--ink);color:var(--bg)}
.mx tfoot td{position:sticky;bottom:0;z-index:3;height:42px;background:var(--surface-2);border-top:2px solid var(--ink);font-weight:700}
.mx tfoot td.l4{z-index:5}
.mx td.tlab{z-index:5;text-align:right;padding-right:10px;color:var(--muted);font-weight:600}
.mx td.tt{text-align:center}
.mx td.tt .z{color:var(--muted);font-weight:500}
.tg{display:inline-flex;align-items:baseline;gap:3px;margin:0 4px}
.tg i{font-style:normal;color:var(--red-ink);font-weight:700}
.mx tr.has-rc td.l1,.mx tr.has-rc td.l2,.mx tr.has-rc td.l3,.mx tr.has-rc td.l4{background:var(--red-wash)}
.mx tr.st-pit td.l1,.mx tr.st-pit td.l2,.mx tr.st-pit td.l3,.mx tr.st-pit td.l4{background:var(--red-soft)}
.mx tr.st-dq td.l1,.mx tr.st-dq td.l2,.mx tr.st-dq td.l3,.mx tr.st-dq td.l4{background:var(--red-soft)}
.mx tr.st-dq td.l1{box-shadow:inset 6px 0 0 var(--red)}
.mx td.l3,.mx th.l3{text-align:left}
.mx td.l3 .nm{display:block;overflow:hidden;text-overflow:ellipsis}
.namecell{display:flex;align-items:center;gap:2px;height:100%}
.namecell .cin{flex:1;min-width:0}
.cin{width:100%;height:34px;border:0;border-radius:4px;background:transparent;padding:0 4px;text-align:left}
.cin.c{text-align:center}

thead .cin{font-weight:600;height:100%;text-align:center;color:var(--ink)}

.setup{max-width:1100px}
.sup{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);cursor:pointer;min-width:0}
.sup input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--ink)}
.sup span{display:grid;gap:2px;line-height:1.25}
.sup small{color:var(--muted);font-size:13px;font-weight:400}
.off-row .sup-pair{grid-column:2}      /* under the name and cert fields, except on wide screens (below) */
@media (min-width:1080px){
  .off-row.has-sup{grid-template-columns:30px minmax(0,460px) minmax(0,1fr);max-width:none}
  .off-row.has-sup .sup-pair{grid-column:auto}
}
.sup-pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;min-width:0}
@media (min-width:981px){      /* wide screens: the last 100m card and its time go on a second line, under the red card and its time */
  .jrow.l100 .jw{grid-row:span 2}
  .jrow.l100 .f-lc{grid-column:4;grid-row:2}
  .jrow.l100 .f-lt{grid-column:5;grid-row:2}
  .jrow.l100 .f-dn{grid-column:6;grid-row:1}
}
.sup:has(input:checked){border-color:var(--ink);background:var(--surface-2)}
.sup:has(input:disabled){cursor:not-allowed;opacity:.6}
.sup-line{margin:0 0 10px;color:var(--muted)}
.sup-line b{color:var(--ink)}
.sec-h{margin:0 0 12px;font:700 22px/1.1 var(--cond)}

/* ---------- How to ---------- */
.howto{max-width:920px}
.howto h2.pg{margin:10px 0 4px;font:700 34px/1.1 var(--cond)}
.howto .lead{margin:0 0 10px;color:var(--muted)}
.rule{display:grid;grid-template-columns:190px 1fr;gap:6px 32px;padding:20px 0;border-top:2px solid var(--ink)}
.rule summary{display:contents;cursor:pointer;list-style:none}      /* display:contents unwraps the summary itself so its h3 sits directly in the grid, as if it were still a plain h3 child, while the native expand/collapse keeps working */
.rule summary::-webkit-details-marker{display:none}
.rule summary::marker{display:none}
.rule h3 .chev{display:inline-block;flex:none;vertical-align:-3px;margin-right:6px;color:var(--muted);transition:transform .15s}
.rule[open] h3 .chev{transform:rotate(90deg)}
.rule summary:hover h3{color:var(--muted)}
.rule h3{margin:0;font:700 30px/1.05 var(--cond)}
.rule h3 small{display:block;margin-top:4px;font:500 14px var(--sans);color:var(--muted)}
.rule ul{margin:0;padding-left:20px;max-width:64ch}
.rule li{margin:0 0 8px}
.sym{display:inline-grid;place-items:center;min-width:26px;height:24px;border-radius:4px;font-weight:700;background:var(--yellow);color:var(--on-yellow);padding:0 4px}
.sym.r{background:var(--red);color:var(--on-red)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--muted);margin-right:6px}
.dot.live{background:var(--live)}
@media (max-width:640px){.rule{grid-template-columns:1fr}}

/* ---------- Dialog + toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,12,16,.55);z-index:50}
.dlg{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:20px}
.dlg h2{margin:0 0 8px;font:700 26px/1.1 var(--cond)}
.dlg .dlg-b p{margin:0 0 10px}
.dlg textarea{width:100%;min-height:200px;padding:10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font:15px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin:0 0 8px;border:1px solid var(--line-strong);border-radius:8px;cursor:pointer}
.opt input{margin:3px 0 0;width:18px;height:18px;flex:none}
.opt span{line-height:1.35}
.opt:has(input:checked){border-color:var(--ink);background:var(--surface-2)}
.dlg-a{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;max-width:min(560px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast[hidden]{display:none}

@supports (padding:max(0px)){
  .top,.tabs,.racebar,main{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .toast{bottom:max(22px,env(safe-area-inset-bottom))}
}
@media (pointer:coarse){
  .cin,.mx thead .cin{font-size:16px}
}
@media (max-width:720px){
  .top{padding-top:10px;padding-bottom:4px;gap:6px 10px}
  .brand h1{font-size:22px}
  .brand{flex-basis:100%}
  .brand svg{width:38px;height:31px}
  .evline{order:2;flex:1 1 0;min-width:0}
  .evline .ev-name,.evline .ev-date{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .evline .ev-date{font-size:15px}
  #sync{order:3;margin-left:auto}
  .tabs{padding-top:6px;padding-bottom:10px}
  .fields{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;align-items:end}
  .fields .field:first-child{grid-column:1/-1}
  .band{padding:12px 14px}
  .toolbar .btn{flex:1 1 calc(50% - 4px)}
  .toolbar .btn.primary{flex-basis:100%}
  .toolbar .sp{display:none}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px}
  .stat{flex-direction:column;gap:2px;align-items:flex-start}
  .stat b{font-size:30px}
  .stat span{font-size:14px;line-height:1.2}
  .stat .thr{display:none}
  .jtools{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0;margin:0 0 4px}
  .jn{width:56px;height:56px;font-size:40px}
  .jid h2{font-size:28px}
  .dlg{padding:16px}
  .dlg-a .btn{flex:1}
}
@media (max-width:360px){
  .seg button:first-child{flex:1.1;font-size:15px}
}
@media (max-width:720px){
  .qr-img{margin:0 auto}
  .qr-info{flex-basis:100%}
  .div-head{display:none}
  .div-row{grid-template-columns:34px minmax(0,1fr);align-items:start}
  .div-row .jchip{margin-top:26px}
  .div-row .lab{display:block}
  .div-row .dn-heats{grid-column:2}
  .div-row .dn-heats input{max-width:140px}
  .rf-count{max-width:none}
  .rf-opts .chk{flex:1 1 100%}
  .rb-title{flex-basis:100%;margin:0}
}
@media (min-width:480px){
  .off-in{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}      /* the cert # & level runs longer than a name */
}
@media (min-width:721px){
  .off-in input{height:32px;font-size:14px}
  .off-row{max-width:500px;align-items:center}
  .off-row .jchip{margin-top:0}
}
@media (max-width:400px){
  .jrow{padding:10px 10px 12px 12px;gap:8px}
  .tin{font-size:20px;padding:0 8px}
  .stamp{width:44px}
  .seg button{font-size:20px}
  .a-edit{grid-template-columns:68px 84px minmax(0,1fr) 44px}
  .a-edit.nohip{grid-template-columns:84px minmax(0,1fr) 44px}
  .a-edit.nobib{grid-template-columns:68px minmax(0,1fr) 44px}
}
@media (max-height:520px){
  .top{padding-top:6px;padding-bottom:2px}
}
@media print{
  .noprint,.tabs,.racebar,.top .pill{display:none !important}
  body{background:#fff}
  .mx-wrap{overflow:visible;border:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important}}

<div id="app">
  <header class="top">
    <div class="top-row1">
      <div class="brand">
        <svg class="logo" viewBox="4 -2 212 172" width="46" height="37" aria-hidden="true">
          <circle cx="56" cy="50" r="50" fill="var(--yellow)" stroke="var(--ink)" stroke-width="2.2"/>
          <path d="M 28 20 H 87 V 37.5 H 45.5 V 80 H 28 Z" fill="var(--ink)"/>
          <circle cx="164" cy="50" r="50" fill="var(--yellow)" stroke="var(--ink)" stroke-width="2.2"/>
          <path d="M 131 47 C 137 28 150 20 158 27 C 166 34 169 54 177 60 C 185 66 193 61 199 49" fill="none" stroke="var(--ink)" stroke-width="15.5"/>
          <circle cx="110" cy="118" r="50" fill="var(--red)" stroke="var(--ink)" stroke-width="2.2"/>
        </svg>
        <h1>Race Walk Officiating <span class="brand-by">by WalkJudge.com</span></h1>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

// QR Code Generator for JavaScript

//
// URL: http://www.d-project.com/

//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';

/* ================================================================
   Saving (debounced, one write at a time per document)
   ================================================================ */

function queueRace(delay){ queuePath(racePath(S.raceId), delay); }           // athletes, officials, thresholds of the current race

  if ((m = /^judges\/j(1[0-2]|[1-9])$/.exec(path))) return {entries:pruned(+m[1], 'main')};
  if ((m = /^races\/([^\/]+)\/judges\/j(1[0-2]|[1-9])$/.exec(path))) return {entries:pruned(+m[2], m[1])};

}

// A judge's own cached copy of the race status can be a moment behind the Recorder's: closing a race does not reach

// Creates a new meet in this account from exported data (a backup, another copy of the app, or the original single meet).
async function writeMeetData(data){
  var uid = S.acct.uid, id = newId('m', 11), code = newId('', 5), now = new Date().toISOString();
  var base = 'cfg/' + uid + '/meets/' + id, ent = 'ent/' + id;
  for (var k = 0; k < 5; k++) { var ex = await db.doc('join/' + code).get(); if (!(ex && ex.exists)) break; code = newId('', 5); }
  await db.doc(base).set({name:str(data.name), date:str(data.date), created:now, archived:false, archivedAt:'', code:code});
  await db.doc(base + '/event/main').set(data.main);
  var rids = Object.keys(data.races || {}), i, j;
  for (i = 0; i < rids.length; i++) await db.doc(base + '/races/' + rids[i]).set(data.races[rids[i]]);
  var top = data.entries && data.entries.main ? Object.keys(data.entries.main) : [];
  for (i = 0; i < top.length; i++) await db.doc(ent + '/judges/' + top[i]).set(data.entries.main[top[i]]);
  var er = data.entries && data.entries.races ? Object.keys(data.entries.races) : [];
  for (i = 0; i < er.length; i++) {
    var js = Object.keys(data.entries.races[er[i]]);
    for (j = 0; j < js.length; j++) await db.doc(ent + '/races/' + er[i] + '/judges/' + js[j]).set(data.entries.races[er[i]][js[j]]);
  }
  await db.doc('join/' + code).set({owner:uid, meetId:id});
  return id;
}

async function importFile(input){
  var f = input.files && input.files[0]; input.value = '';
  if (!f || !S.canWrite || !S.acct || !S.acct.uid) return;
  try {
    var text = await new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(String(r.result)); }; r.onerror = rej; r.readAsText(f); });
    var data = JSON.parse(text);
    if (!data || data.kind !== 'race-walk-meet' || !data.main || typeof data.main !== 'object') { toast('That file is not a meet export.'); return; }
    var id = await writeMeetData(data);

function setHTML(el, html){

  return true;
}
var raf = 0;

}
function captureUI(){
  var a = document.activeElement;

  var ui = {f:f, s:null, e:null, wx:0, wy:0, px:window.pageXOffset, py:window.pageYOffset};
  if (f && typeof a.selectionStart === 'number') { try { ui.s = a.selectionStart; ui.e = a.selectionEnd; } catch(e){} }
  var w = $('.mx-wrap'); if (w) { ui.wx = w.scrollLeft; ui.wy = w.scrollTop; }
  return ui;
}
function restoreUI(ui){
  var w = $('.mx-wrap'); if (w) { w.scrollLeft = ui.wx; w.scrollTop = ui.wy; }
  if (ui.f) {
    var el = document.querySelector('[data-f="' + ui.f + '"]');
    if (el && el !== document.activeElement) {
      try { el.focus({preventScroll:true}); } catch(e){ el.focus(); }
      if (ui.s != null) { try { el.setSelectionRange(ui.s, ui.e); } catch(e){} }
    }

// Red Cards (not Recorder) gets fit to the available width here; neither table constrains its own height any more --
// the page itself scrolls vertically, the same as the rest of the app, instead of a separate scrolling region inside the table.
function fitGrid(){
  var w = document.querySelector('.mx-wrap');
  if (!w) return;
  fitRedCards(w);
}
// The Red Cards table always scales to exactly fill the available width -- shrinking when there are enough judges to
// make it wider than the screen, but also growing when there are few enough that it would otherwise sit narrower than
// the screen with empty space to its right, however many judges or athletes there are. (Recorder is unchanged: it
// still scrolls horizontally, with pinned columns and a sticky header, which only works unscaled like this.)
function fitRedCards(wrap){
  if (!wrap.classList.contains('mx-wrap-rc')) return;
  var fit = wrap.querySelector('.mx-fit'), scaleEl = wrap.querySelector('.mx-scale');
  var table = scaleEl && scaleEl.querySelector('table');
  if (!fit || !scaleEl || !table) return;
  scaleEl.style.transform = 'none'; fit.style.width = ''; fit.style.height = '';
  // Measured on the table itself, not the wrapping .mx-scale div: that div is a plain block element which stretches
  // to fill .mx-fit regardless of how wide its content actually is, so its own scrollWidth is the stretched
  // container's width, not the table's -- measuring that instead of the table silently made the width term below
  // a no-op (natural-width-over-available-width was always ~1), which is why this previously left empty space on
  // the right whenever height was the more restrictive dimension, however many judges there were.
  var naturalW = table.scrollWidth, naturalH = table.scrollHeight;
  var availW = wrap.clientWidth;      // read directly: this already excludes the wrap's own border, unlike a fresh viewport calculation
  if (!naturalW || !naturalH || !availW) return;
  var scale = availW / naturalW;
  scaleEl.style.transform = Math.abs(scale - 1) > 0.001 ? 'scale(' + scale + ')' : 'none';
  scaleEl.style.transformOrigin = 'top left';
  fit.style.width = Math.ceil(naturalW * scale) + 'px';
  fit.style.height = Math.ceil(naturalH * scale) + 'px';
}

function useTimer(){ return S.event.useTimer === true; }

/* ---------- Penalty Zone ----------
   Kept with the Penalty Zone Manager's entries (position 12), so the Recorder and the PZM can both use the tab and every device sees it.
   Each athlete's entry holds when they arrived (pza) and when they were released (pzr), as milliseconds, how long their penalty is

function pzState(aid, now){

function pzServed(aid){ return usePZ() && !!getEntry(PZM, aid).pzv; }

function pzParse(txt){

// Athletes shown on the Penalty Zone tab: everyone who has reached the Penalty Zone red card count, plus anyone with a time recorded.
function pzAthletes(){
  var pit = S.event.pit, now = Date.now(), out = [];
  S.event.athletes.forEach(function(a, i){
    var c = redCount(a.id), st = pzState(a.id, now);

function pzGroups(rows){

/* ---------- Matrix (shared by Recorder and Red Cards) ---------- */
/* ---- totals for the Recorder: each yellow paddle type and each red card type per judge, and all red cards in the race ---- */
function judgeTotals(n){
  var t = {y1:0, y2:0, gt:0, tl:0, lgt:0, ltl:0};
  S.event.athletes.forEach(function(a){
    var e = getEntry(n, a.id);
    if (e.y1) t.y1++;
    if (e.y2) t.y2++;
    if (e.rc === '>') t.gt++; else if (e.rc === '~') t.tl++;
    if (n === 1 && l100On()) { if (e.lc === '>') t.lgt++; else if (e.lc === '~') t.ltl++; }
  });
  return t;
}
function raceRedTotal(){ return S.event.athletes.reduce(function(m, a){ return m + redCount(a.id); }, 0); }
// DQ notifications shown with the Chief Judge's: their own, plus any entered by AC1 or AC2, each marked with who it came from.
function dnItems(aid, own){
  var out = [];
  if (own && own.dn) out.push({who:'', t:own.dn});
  for (var n = NMAIN + 1; n <= NMAIN + NAC; n++) { if (!isActive(n)) continue; var e = getEntry(n, aid); if (e.dn) out.push({who:jtag(n), t:e.dn}); }
  return out;
}
function dnText(aid, own){ return dnItems(aid, own).map(function(i){ return i.who ? i.t + ' (' + i.who + ')' : i.t; }).join('; '); }
function dnCellHTML(items){ return items.map(function(i){ return '<span class="dni">' + (i.who ? '<span class="acm">' + i.who + '</span>' : '') + '<span class="tm">' + esc(i.t) + '</span></span>'; }).join(''); }
function acNoteHTML(aid){
  var it = dnItems(aid, null);
  return it.length ? '<span class="acn" title="DQ notifications entered by the assistant chief judges">' + it.map(function(i){ return '<span class="acnp"><span class="acm">' + i.who + '</span>' + esc(i.t) + '</span>'; }).join(' ') + '</span>' : '';
}
function gridCell(t, e, g, first, aid){
  var v = e[t === 'rc100' ? 'rc' : t], on = v ? (t === 'y1' || t === 'y2' ? 'on-y' : 'on-r') : '', inner = '';
  if (v) inner = (t === 'rc' || t === 'rc100' || t === 'lc') ? '<span class="chip-rc">' + esc(v) + '</span>' : '<span class="tm">' + esc(v) + '</span>';
  if (t === 'dn' && aid) { var di = dnItems(aid, e); on = di.length ? 'on-r' : ''; inner = dnCellHTML(di); }
  return '<td class="' + (first ? 'jstart' + g + (on ? ' ' + on : '') : (on || g.trim())) + '">' + inner + '</td>';
}
function matrixHTML(mode, rows, emptyMsg){
  var ev = S.event, edit = mode === 'rec' && !ro(), dis = ro() ? ' disabled' : '';

  var spec = act.map(function(n){ return judgeCols(n, mode); });   // each judge's own columns

      if (bib) tds += '<td class="l2"><input class="cin c" data-bind="ath" data-aid="' + a.id + '" data-k="bib" data-f="ath:' + a.id + ':bib" value="' + esc(a.bib) + '" placeholder="Bib" aria-label="Bib number"></td>';
      tds += '<td class="l3"><div class="namecell"><input class="cin" data-bind="ath" data-aid="' + a.id + '" data-k="name" data-f="ath:' + a.id + ':name" value="' + esc(a.name) + '" placeholder="Athlete name" aria-label="Athlete name">' +
            '<button class="xbtn" data-act="del-athlete" data-aid="' + a.id + '" data-f="del:' + a.id + '" aria-label="Remove athlete ' + esc(athLabel(a)) + '"' + dis + '>' + ICON_X_SM + '</button></div></td>';

function counterHTML(c, st, aid){

}
function jlabel(n){ return S.event.judges[n - 1].name || ('Judge ' + n); }
function judgeLines(a, showY){
  var out = '';

    var e = getEntry(n, a.id), chips = '', chief = chiefSheet(n);
    if (showY && !chief && e.y1) chips += '<span class="pchip y">Yellow &gt; ' + esc(e.y1) + '</span>';
    if (showY && !chief && e.y2) chips += '<span class="pchip y">Yellow ~ ' + esc(e.y2) + '</span>';
    if (e.rc) chips += '<span class="pchip r">' + (chief ? 'Last 100m red card ' : 'Red card ') + esc(e.rc) + (e.rt ? ' ' + esc(e.rt) : '') + '</span>';
    if (n === 1 && l100On() && e.lc) chips += '<span class="pchip r">Last 100m red card ' + esc(e.lc) + (e.lt ? ' ' + esc(e.lt) : '') + '</span>';
    else if (e.rt && (showY || chief)) chips += '<span class="pchip t">Time ' + esc(e.rt) + '</span>';
    if (n === 1) dnItems(a.id, e).forEach(function(it){ chips += '<span class="pchip d">DQ notification ' + esc(it.t) + (it.who ? ' <span class="acm">' + it.who + '</span>' : '') + '</span>'; });
    if (chips) out += '<li><span class="jchip" title="' + esc(jlabel(n)) + '">' + n + '</span><span class="jnm">' + esc(jlabel(n)) + '</span>' + chips + '</li>';
  });
  return out ? '<ul class="a-judges">' + out + '</ul>' : '';
}
function cardIdHTML(a){

// Splits one pasted line into cells: tabs first (what spreadsheets and browsers normally copy), then runs of two or
// more spaces (common when a results website's table copies as plain, column-aligned text), then commas as a last
// resort. Whichever of these actually produces more than one cell is used.
function splitPasteLine(line){
  if (line.indexOf('\t') >= 0) return line.split('\t').map(function(p){ return p.trim(); });
  if (/ {2,}/.test(line.trim())) { var bySpace = line.trim().split(/ {2,}/); if (bySpace.length > 1) return bySpace.map(function(p){ return p.trim(); }); }
  return line.split(',').map(function(p){ return p.trim(); });
}
// Column headers a results website might use, matched case-insensitively against a whole cell. Lane counts the same
// as Hip -- this app's own Setup page already calls that field "hip/lane #" for the same reason. Any other column
// (team, seed time, age, and so on) is simply not recognized, so it is ignored rather than breaking the import.
var PASTE_HDR = {hip:['hip', 'hip#', 'hip #', 'lane', 'lane#', 'lane #', 'pos', 'position'], bib:['bib', 'bib#', 'bib #', 'no', 'no.', 'number', 'athlete no', 'athlete no.', 'athlete number', 'uniform #'], name:['name', 'athlete', 'athlete name', 'competitor', 'competitor name']};

// not look like a header row at all (an ordinary data row does not literally read "name" or "lane" in any cell).
function detectPasteHeader(cells){
  var map = {hip:-1, bib:-1, name:-1}, hit = false;
  cells.forEach(function(c, i){
    var low = c.toLowerCase().trim();
    ['hip', 'bib', 'name'].forEach(function(k){ if (map[k] === -1 && PASTE_HDR[k].indexOf(low) !== -1) { map[k] = i; hit = true; } });
  });
  return hit ? map : null;
}
function openPaste(){
  var hip = useHip(), bib = useBib();

  var ex1 = (hip ? '1&#9;' : '') + (bib ? '201&#9;' : '') + 'Athlete Name', ex2 = (hip ? '2&#9;' : '') + (bib ? '202&#9;' : '') + 'Athlete Name';

    body:'<p>One athlete per line: ' + fmt + '. Separate with tabs or commas. Copying ' + (idCount() + 1 === 3 ? 'three columns' : 'two columns') + ' from a spreadsheet works.</p>' +
      '<p>You can also paste a start list copied from a live results website. If the first line is a header, its columns are matched by name: Lane counts the same as Hip, Bib is kept separately when present, and other columns (team, seed time, and so on) are ignored.' + (inHeats() ? ' This adds to the race currently open; switch races first to bring in another.' : '') + '</p>' +
      '<textarea id="paste-ta" placeholder="' + ex1 + '&#10;' + ex2 + '" aria-label="Athlete list"></textarea>',
    ok:'Add athletes',
    onOk:function(){
      var text = $('#paste-ta').value, added = 0, skipped = 0, need = idCount(), hdr = null, first = true;
      text.split(/\r?\n/).forEach(function(line){
        if (!line.trim()) return;
        var parts = splitPasteLine(line);
        if (first) { first = false; hdr = detectPasteHeader(parts); if (hdr) return; }
        if (!hdr && /^(hip|lane|bib)/i.test(parts[0])) return;
        var v = {hip:'', bib:''}, nm = '', ok;
        if (hdr) {
          if (hdr.hip !== -1 && parts[hdr.hip]) v.hip = parts[hdr.hip];
          if (hdr.bib !== -1 && parts[hdr.bib]) v.bib = parts[hdr.bib];
          nm = hdr.name !== -1 ? (parts[hdr.name] || '') : '';
          ok = !!(v.hip || v.bib) && !!nm;
        } else {
          var i = 0; ok = parts.length >= need + 1;

          if (ok && bib) { v.bib = parts[i++]; ok = !!v.bib; }
          nm = ok ? parts.slice(i).join(', ') : '';
          ok = ok && !!nm;
        }
        if (!ok) { skipped++; return; }
        v.name = nm;
        addAthlete(false, v);
        added++;
      });

      render();
      toast(added + (added === 1 ? ' athlete added' : ' athletes added') + (skipped ? '. ' + skipped + (skipped === 1 ? ' line' : ' lines') + ' skipped (each needs a hip/lane # or bib #, and a name).' : '.'));

}

var PDF_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
var PC = {ink:[17,26,34], muted:[86,98,110], line:[210,216,222], strong:[154,166,178], white:[255,255,255], s2:[243,245,247],
          yel:[247,201,13], onYel:[27,21,0], yelSoft:[255,240,166], yelInk:[74,58,0], red:[200,38,27], redSoft:[248,211,207], redWash:[253,241,239]};

function ensurePDF(){
  return new Promise(function(resolve, reject){
    if (window.jspdf && window.jspdf.jsPDF) return resolve(window.jspdf.jsPDF);
    var el = document.createElement('script'), t = setTimeout(function(){ reject(new Error('timeout')); }, 12000);
    el.src = PDF_SRC;
    el.onload = function(){ clearTimeout(t); (window.jspdf && window.jspdf.jsPDF) ? resolve(window.jspdf.jsPDF) : reject(new Error('missing')); };
    el.onerror = function(){ clearTimeout(t); reject(new Error('load')); };
    document.head.appendChild(el);
  });
}
// The built-in PDF fonts cover Latin-1 only, so other characters fall back to a plain letter or "?".
function pdfSafe(v){
  var t = str(v).replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/[\u2013\u2014]/g, '-')
                .replace(/\u2026/g, '...').replace(/[\u00A0\u2007\u2009\u200A\u202F]/g, ' ');
  return Array.from(t.normalize('NFC')).map(function(c){
    var n = c.charCodeAt(0);
    if (n < 32 || (n >= 127 && n < 160)) return n === 9 ? ' ' : '?';
    if (n <= 255) return c;
    var b = c.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return (b !== c && b.length === 1 && b.charCodeAt(0) < 128) ? b : '?';
  }).join('');
}

// Rules shown at the bottom of the Timer Notification PDF, 3 to a row, in RULES_REF's own order -- a plain grid,

  var rows = [[], []];
  RULES_REF.forEach(function(r, i){ rows[Math.floor(i / 3)].push(r); });
  return rows;
}
function buildTimerPDF(JS){

}

async function exportPDF(kind, paper){
  if (!dl) return;
  var JS;
  try { JS = await ensurePDF(); }
  catch (err) { toast('The PDF tool could not load. Check the connection and try again.'); return; }
  var doc;
  try { doc = kind === 'pz' ? buildPZPDF(JS, paper) : buildPDF(JS, kind, paper); }
  catch (err) { toast('Could not build the PDF.'); try { console.error(err); } catch (x) {} return; }
  var ev = S.event;
  var fname = 'race-walk-' + (kind === 'rc' ? 'red-cards' : kind === 'pz' ? 'penalty-zone' : 'recorder') + '-' + (ev.name || 'meet').replace(/[^\w.-]+/g, '-') + (inHeats() ? '-' + raceLabel(S.raceId).replace(/[^\w.-]+/g, '-') : '') + (ev.date ? '-' + ev.date : '') + '.pdf';
  try { await dl.save({filename:fname, data:doc.output('arraybuffer')}); toast('PDF ready.'); }
  catch (err) { if (!err || err.code !== 'declined') toast('Could not export the PDF in this view.'); }
}
