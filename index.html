<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>walkjudge.com — Coming Soon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* Semi-transparent race walk silhouettes background */
        .silhouettes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("racewalk-silhouettes.png") center/cover no-repeat;
            opacity: 0.22;
            z-index: -1;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Logo animation: pop in, then expand to 3x and stay */
        .logo {
            width: 320px;
            max-width: 80%;
            animation: popin 1.2s ease-out forwards,
                       grow 2.5s ease-out 1.4s forwards;
            opacity: 0;
        }

        @keyframes popin {
            0%   { transform: scale(0.6); opacity: 0; }
            60%  { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes grow {
            0%   { transform: scale(1); }
            100% { transform: scale(3); }
        }

        h1 {
            font-size: 2.8rem;
            margin-top: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: fadein 2s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadein {
            0%   { opacity: 0; }
            100% { opacity: 1; }
        }

        .tagline {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #ccc;
            animation: fadein 2.8s ease-out forwards;
            opacity: 0;
        }

        .pulse {
            margin-top: 40px;
            width: 18px;
            height: 18px;
            background: #e60000;
            border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out;
        }

        @keyframes pulse {
            0%   { transform: scale(1);   opacity: 0.8; }
            50%  { transform: scale(1.6); opacity: 0.4; }
            100% { transform: scale(1);   opacity: 0.8; }
        }
    </style>
</head>
<body>

<div class="silhouettes"></div>

<div class="container">
    <!-- Use the new bold-outlined logo here -->
    <img src="race-walk-officiating-logo.png" alt="Race Walk Officiating Logo" class="logo">

    <h1>walkjudge.com</h1>
    <div class="tagline">A new era of race walk officiating is on the way.</div>

    <div class="pulse"></div>
</div>

</body>
</html>
