<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>walkjudge.com — Coming Soon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* Cleaned race walk background with fade-in + drift */
        .silhouettes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("racewalk-background.jpg") center/cover no-repeat;
            opacity: 0;
            animation: bgfade 4s ease-out 1.4s forwards,
                       drift 18s linear infinite;
            z-index: -1;
        }

        @keyframes bgfade {
            0%   { opacity: 0; }
            100% { opacity: 0.22; }
        }

        @keyframes drift {
            0%   { background-position: center; }
            50%  { background-position: center 20px; }
            100% { background-position: center; }
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Logo animation + glow */
        .logo {
            width: 320px;
            max-width: 80%;
            animation: popin 1.2s ease-out forwards,
                       grow 2.5s ease-out 1.4s forwards,
                       glow 2.5s ease-out 1.4s forwards;
            opacity: 0;
        }

        @keyframes popin {
            0%   { transform: scale(0.6); opacity: 0; }
            60%  { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes grow {
            0%   { transform: scale(1); }
            100% { transform: scale(3); }
        }

        @keyframes glow {
            0%   { filter: drop-shadow(0 0 0px #e60000); }
            100% { filter: drop-shadow(0 0 22px #e60000); }
        }

        h1 {
            font-size: 2.4rem;
            margin-top: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 1;
           /* animation: fadein 2s ease-out forwards,
                       fadeout 1.2s ease-out 1.4s forwards;*/
        }

        @keyframes fadein {
            0%   { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes fadeout {
            0%   { opacity: 1; }
            100% { opacity: 0; }
        }

        .tagline {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #ccc;
            opacity: 1;
            /*animation: fadein 2.8s ease-out forwards,
                       fadeout 1.2s ease-out 1.4s forwards;*/
        }

        .pulse {
            margin-top: 40px;
            width: 18px;
            height: 18px;
            background: #e60000;
            border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out,
                       fadeout 1.2s ease-out 1.4s forwards;
        }

        @keyframes pulse {
            0%   { transform: scale(1);   opacity: 0.8; }
            50%  { transform: scale(1.6); opacity: 0.4; }
            100% { transform: scale(1);   opacity: 0.8; }
        }

        .contact {
            margin-top: 60px;
            font-size: 1rem;
            opacity: 0;
            animation: contactfade 1.2s ease-out 3s forwards;
        }

        @keyframes contactfade {
            0%   { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .contact a {
            color: #fff;
            text-decoration: none;
            border: 3px solid #e60000;
            padding: 20px 40px;
            font-size: 1.8rem;
            border-radius: 10px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .contact a:hover {
            background: #e60000;
            color: #fff;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .tagline { font-size: 0.9rem; }
            .logo { width: 200px; }

            .contact a {
                font-size: 2.2rem;
                padding: 26px 48px;
                border-width: 4px;
            }
        }
    </style>
</head>
<body>

<div class="silhouettes"></div>

<div class="container">
    <img src="race-walk-officiating-logo.png" alt="Race Walk Officiating Logo" class="logo">

    <h1>WalkJudge.com</h1>
    <div class="tagline">A new era of Race Walk officiating is on the way.</div>

    <div class="pulse"></div>

    <div class="contact">
        <a href="mailto:walkjudgeapp@gmail.com">Contact Us</a>
    </div>
</div>

</body>
</html>
