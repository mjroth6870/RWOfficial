<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>walkjudge.com</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
    background:#111;
    color:#fff;
}

/* Background Image */
.silhouettes{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:url('racewalk-background.jpg') center center/cover no-repeat;
    opacity:0;
    z-index:-1;
    animation:
        bgfade 4s ease-out 1.4s forwards,
        drift 18s ease-in-out infinite;
}

@keyframes bgfade{
    from{opacity:0;}
    to{opacity:.22;}
}

@keyframes drift{
    0%{
        background-position:center center;
    }
    50%{
        background-position:center 20px;
    }
    100%{
        background-position:center center;
    }
}

/* Main Layout */
.container{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

/* Logo */
.logo{
    width:320px;
    max-width:80%;
    opacity:0;

    animation:
        popin 1.2s ease-out forwards,
        grow 2.5s ease-out 1.4s forwards,
        glow 2.5s ease-out 1.4s forwards;
}

@keyframes popin{
    0%{
        transform:scale(.6);
        opacity:0;
    }

    60%{
        transform:scale(1.08);
        opacity:1;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes grow{
    0%{
        transform:scale(1);
    }

    100%{
        transform:scale(3);
    }
}

@keyframes glow{
    0%{
        filter:drop-shadow(0 0 0px #e60000);
    }

    100%{
        filter:drop-shadow(0 0 22px #e60000);
    }
}

/* Site Name */
h1{
    margin-top:25px;
    font-size:2.5rem;
    letter-spacing:3px;
    text-transform:uppercase;
    opacity:0;
    animation:fadein 2s ease-out forwards;
}

/* Permanent Tagline */
.tagline{
    margin-top:15px;
    font-size:1.1rem;
    color:#e0e0e0;
    opacity:0;
    animation:fadein 2.8s ease-out forwards;
}

@keyframes fadein{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

/* Buttons Container */
.button-row{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:60px;

    opacity:0;
    animation:buttonfade 1.2s ease-out 3s forwards;
}

@keyframes buttonfade{
    0%{
        opacity:0;
        transform:translateY(25px);
    }

    100%{
        opacity:1;
        transform:translateY(0);
    }
}

/* Buttons */
.button-row a{
    display:inline-block;
    min-width:280px;

    padding:20px 40px;

    font-size:1.8rem;
    font-weight:bold;

    color:#fff;
    text-decoration:none;

    border:3px solid #e60000;
    border-radius:10px;

    background:rgba(0,0,0,.35);

    transition:all .3s ease;
}

.button-row a:hover{
    background:#e60000;
    box-shadow:0 0 18px rgba(230,0,0,.75);
}

/* Tablet */
@media (max-width:768px){

    h1{
        font-size:2rem;
    }

    .tagline{
        font-size:1rem;
    }

    .logo{
        width:240px;
    }

    .button-row a{
        min-width:250px;
        font-size:1.6rem;
    }
}

/* Phone */
@media (max-width:480px){

    h1{
        font-size:1.6rem;
    }

    .tagline{
        font-size:.95rem;
    }

    .logo{
        width:200px;
    }

    .button-row{
        flex-direction:column;
        width:100%;
        max-width:450px;
    }

    .button-row a{
        width:100%;
        min-width:auto;

        font-size:2.2rem;
        padding:26px 48px;
        border-width:4px;
    }
}
</style>
</head>

<body>

<div class="silhouettes"></div>

<div class="container">

    <img
        src="race-walk-officiating-logo.png"
        alt="Race Walk Officiating"
        class="logo"
    >

    <h1>walkjudge.com</h1>

    <div class="tagline">
        The Home of Race Walk Officiating
    </div>

    <div class="button-row">

        <a href="index2.html">
            Click To Enter
        </a>

        <a href="mailto:walkjudgeapp@gmail.com">
            Contact Us
        </a>

    </div>

</div>

</body>
</html>
