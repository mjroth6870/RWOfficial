<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Race Walk Officiating</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECEF; --surface:#FFFFFF; --surface-2:#F3F5F7;
  --ink:#111A22; --muted:#56626E; --line:#D2D8DE; --line-strong:#9AA6B2;
  --yellow:#F7C90D; --on-yellow:#1B1500; --yellow-soft:#FFF0A6; --yellow-ink:#4A3A00;
  --red:#C8261B; --on-red:#FFFFFF; --red-soft:#F8D3CF; --red-wash:#FDF1EF; --red-ink:#8E1A12;
  --live:#1B8553; --focus:#1F5FFF; --off-bg:#CBD1D8; --off-ink:#44505B;
  --blue:#1F5FD6; --blue-soft:#DCE8FF; --blue-ink:#123A8C; --green:#1B8553; --green-soft:#D7F2E3; --green-ink:#0F5A38; --orange:#C2570C; --orange-soft:#FFE6D0; --orange-ink:#7A3506; --on-st:#FFFFFF;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --w-hip:56px; --w-bib:56px; --w-name:184px; --w-cnt:124px;
  --w-y:62px; --w-rc:58px; --w-t:74px; --w-rc100:88px; --w-dn:88px;
  --h1:34px; --h2:38px; --h3:36px; --h4:34px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1116; --surface:#141B22; --surface-2:#1B242D;
    --ink:#E8EDF2; --muted:#98A5B2; --line:#26313B; --line-strong:#4A5967;
    --yellow:#F7C90D; --on-yellow:#1B1500; --yellow-soft:#3D3407; --yellow-ink:#FFE066;
    --red:#E5382B; --on-red:#FFFFFF; --red-soft:#4B1C18; --red-wash:#241513; --red-ink:#FF9B92;
    --live:#3CC383; --focus:#7AA5FF; --off-bg:#2C3742; --off-ink:#A9B4BF;
    --blue:#5B93FF; --blue-soft:#14284D; --blue-ink:#A9C7FF; --green:#3CC383; --green-soft:#0F3323; --green-ink:#8FE0B8; --orange:#F08A3A; --orange-soft:#452410; --orange-ink:#FFC08A; --on-st:#0C1116;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1116; --surface:#141B22; --surface-2:#1B242D;
  --ink:#E8EDF2; --muted:#98A5B2; --line:#26313B; --line-strong:#4A5967;
  --yellow:#F7C90D; --on-yellow:#1B1500; --yellow-soft:#3D3407; --yellow-ink:#FFE066;
  --red:#E5382B; --on-red:#FFFFFF; --red-soft:#4B1C18; --red-wash:#241513; --red-ink:#FF9B92;
  --live:#3CC383; --focus:#7AA5FF; --off-bg:#2C3742; --off-ink:#A9B4BF;
  --blue:#5B93FF; --blue-soft:#14284D; --blue-ink:#A9C7FF; --green:#3CC383; --green-soft:#0F3323; --green-ink:#8FE0B8; --orange:#F08A3A; --orange-soft:#452410; --orange-ink:#FFC08A; --on-st:#0C1116;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button[disabled],input[disabled]{cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Top bar ---------- */
.top{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding:14px 16px 6px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font:700 26px/1 var(--cond);letter-spacing:.01em}
.evline{display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;flex:1;min-width:160px}
.ev-name{font:600 20px/1.1 var(--cond)}
.ev-date{color:var(--muted)}
.ev-none{color:var(--muted);font-size:15px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-size:14px;font-weight:600;white-space:nowrap}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.pill.live i{background:var(--live)}
.pill.save i{background:var(--yellow)}
.pill.err{border-color:var(--red);color:var(--red-ink)} .pill.err i{background:var(--red)}
.pill.boot i{background:var(--line-strong)}

/* ---------- Tabs ---------- */
.tabs{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px 16px 12px}
.tabrow{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:thin;max-width:100%}
.tabrow.judgerow{flex-wrap:wrap;overflow-x:visible}      /* the judges wrap onto a second line on a narrow screen instead of scrolling */
.tabs .judgerow .grp:first-child{margin-left:0;padding-left:0;border-left:0}
.tab{flex:none;min-height:44px;padding:0 16px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.tab:hover{border-color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.jt{min-width:44px;padding:0;justify-content:center;font:700 22px/1 var(--cond)}
.tabs .grp{flex:none;margin:0 2px 0 10px;padding-left:12px;border-left:2px solid var(--line-strong);color:var(--muted);font-weight:600;font-size:14px}
.rf-opts.pz-opt{margin-top:10px}
.tab[disabled]{background:var(--off-bg);color:var(--off-ink);border-color:var(--off-bg);cursor:not-allowed}
.tab[disabled]:hover{border-color:var(--off-bg)}
.tab.jt.off{background:var(--off-bg);color:var(--off-ink);border-color:var(--off-bg)}
.tab.jt.off:hover{border-color:var(--line-strong)}
.tab.jt.off[aria-selected="true"]{background:var(--off-ink);color:var(--bg);border-color:var(--off-ink)}
.badge{background:var(--red);color:var(--on-red);border-radius:999px;font-size:13px;line-height:1;padding:3px 8px;font-weight:700}

.racebar{padding:0 16px 12px}
.racebar:empty{display:none}
.rb-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.rb-title{font-weight:600;color:var(--muted);font-size:14px;margin-right:2px}
.rb-grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 8px 5px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:100%;min-width:0}
.rb-name{font-weight:600;max-width:190px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-h{color:var(--muted);font-size:14px;margin-right:2px}
.rb{min-width:44px;height:44px;padding:0 6px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:700 22px/1 var(--cond)}
.rb:hover{border-color:var(--ink)}
.rb.st-up{background:var(--blue-soft);border:2px solid var(--blue);color:var(--blue-ink)}
.rb.st-open{background:var(--green-soft);border:2px solid var(--green);color:var(--green-ink)}
.rb.st-done{background:var(--orange-soft);border:2px solid var(--orange);color:var(--orange-ink)}
.rb.on{color:var(--on-st);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.rb.on.st-up{background:var(--blue);border-color:var(--blue)}
.rb.on.st-open{background:var(--green);border-color:var(--green)}
.rb.on.st-done{background:var(--orange);border-color:var(--orange)}
.rb-legend{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-left:4px;font-size:13px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.lg i,.ev-st i{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.lg.st-up{color:var(--blue)} .lg.st-open{color:var(--green)} .lg.st-done{color:var(--orange)}
.ev-st{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;border:1px solid;font-size:14px;font-weight:600;white-space:nowrap;max-width:100%;min-width:0}
.ev-st-r{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ev-st-s{flex:none}
.ev-st.st-up{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink)}
.ev-st.st-open{background:var(--green-soft);border-color:var(--green);color:var(--green-ink)}
.ev-st.st-done{background:var(--orange-soft);border-color:var(--orange);color:var(--orange-ink)}
.banner.st-up{background:var(--blue-soft);border-left-color:var(--blue);color:var(--blue-ink)}
.banner.st-done{background:var(--orange-soft);border-left-color:var(--orange);color:var(--orange-ink)}
.rstatus{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 12px}
.rs-title{font-weight:600;color:var(--muted);font-size:14px}
.rs-seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.rs-b{min-height:44px;padding:0 18px;border:0;border-left:1px solid var(--line-strong);background:var(--surface);font-weight:600}
.rs-b:first-child{border-left:0}
.rs-b:hover:not([disabled]):not([aria-pressed="true"]){background:var(--surface-2)}
.rs-b[aria-pressed="true"]{color:var(--on-st)}
.rs-b[aria-pressed="true"].st-up{background:var(--blue)}
.rs-b[aria-pressed="true"].st-open{background:var(--green)}
.rs-b[aria-pressed="true"].st-done{background:var(--orange)}
.rs-note{color:var(--muted);font-size:14px}
.race-note{margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.race-note p{margin:0 0 8px}
.copy-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.copy-row label{font-weight:600;font-size:14px;color:var(--muted)}
.copy-row select{height:42px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);max-width:100%;min-width:0}
.race-h{margin:2px 0 10px;font:700 26px/1.1 var(--cond)}
.jrace-line{margin:8px 0 0 !important}
.jrace{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600}
main{padding:0 16px 56px}

/* ---------- Generic controls ---------- */
.btn{min-height:42px;padding:0 16px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;font-weight:600}
.btn:hover:not([disabled]){border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--red-ink);border-color:var(--red)}
.btn.danger-solid{background:var(--red);color:var(--on-red);border-color:var(--red)}
.btn[disabled]{opacity:.5}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rformat{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.rf-opts{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px 0 14px;border:2px solid var(--line-strong);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:600}
.chk input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--ink)}
.chk span{display:grid;line-height:1.2}
.chk small{color:var(--muted);font-weight:400;font-size:13px}
.chk:has(input:checked){border-color:var(--ink)}
.chk:has(input:disabled){cursor:not-allowed;opacity:.6}
.rf-div{margin-top:14px;display:grid;gap:12px}
.rf-count{max-width:220px}
.div-list{display:grid;gap:8px;max-width:780px}
.div-head,.div-row{display:grid;grid-template-columns:34px minmax(0,1fr) 150px;gap:8px 10px;align-items:end}
.div-head{color:var(--muted);font-weight:600;font-size:14px;margin-bottom:-2px}
.div-row .jchip{align-self:center}
.dn-name{display:grid;gap:6px;min-width:0}
.div-row select{width:100%;min-width:0;height:44px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.div-row select[disabled]{background:var(--surface-2)}
.mt-group .rf-note{margin-top:8px}
.div-row input{width:100%;min-width:0;height:44px;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.div-row input[disabled]{background:var(--surface-2)}
.div-row .lab{display:none;font-weight:600;font-size:13px;color:var(--muted);margin-bottom:3px}
.rf-note{margin:0;color:var(--muted);font-size:14px;max-width:72ch}
.rf-opts + .rf-note{margin-top:10px}
.jpicker{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.jp-head{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.jp-title{font-weight:600;font-size:14px;color:var(--muted)}
.jp-count{font-weight:600}
.jp-row{display:flex;flex-wrap:wrap;gap:6px}
.jpick{width:48px;height:48px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink);font:700 24px/1 var(--cond)}
.jpick[aria-pressed="false"]{background:var(--off-bg);color:var(--off-ink);border-color:var(--off-bg)}
.jpick:hover:not([disabled]){border-color:var(--focus)}
.apick{min-width:56px;height:48px;padding:0 8px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink);font:700 20px/1 var(--cond)}
.apick[aria-pressed="false"]{background:var(--off-bg);color:var(--off-ink);border-color:var(--off-bg)}
.apick:hover:not([disabled]){border-color:var(--focus)}
.jp-sep{flex:none;width:16px}
.apick[disabled]{opacity:.5;cursor:not-allowed}
.apick.pzm{min-width:64px}
.pzm-line{display:flex;align-items:center;gap:10px;margin:8px 0}
.pz-times{margin:14px 0 10px}
.pz-opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.pz-opt{min-height:44px;padding:0 14px;border:2px solid var(--line-strong);border-radius:8px;background:var(--surface);font-weight:700}
.pz-opt:hover:not([disabled]){border-color:var(--ink)}
.pz-opt[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pz-opt[disabled]{opacity:.55;cursor:not-allowed}
.pz-h{margin:16px 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.pz-setup{margin:8px 0 12px}
.pzlist{list-style:none;margin:8px 0 4px;padding:0;display:grid;gap:8px}
.pzrow{display:grid;grid-template-columns:minmax(200px,1.2fr) auto 150px auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line-strong);border-radius:10px}
.pzrow.run,.pzrow.time{border-left-color:var(--ink)}
.pzrow.time{border-left-color:var(--ink)}
.pzrow.served{border-left-color:var(--green)}
.pzrow.dq{background:var(--red-soft);border-left-color:var(--red)}
.pz-who .jw{display:block}
.pz-meta{display:block;margin-top:2px;color:var(--muted);font-size:14px}
.pz-box{display:flex;gap:10px}
.pz-box .pz-tfld{flex:0 0 176px;min-width:176px}
.pz-tfld .tin{font-size:18px;padding:0 6px;letter-spacing:0}
.pz-in{font-variant-numeric:tabular-nums}
.pz-t{display:grid;justify-items:center;gap:4px;min-height:44px;align-content:center}
.pz-cd{display:inline-block;min-width:92px;padding:8px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-strong);text-align:center;font:700 30px/1 var(--cond);font-variant-numeric:tabular-nums}
.pz-cd.warn{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
.pz-cd.done{background:var(--ink);color:var(--bg);border-color:var(--ink)}      /* time is up: not yellow, which is only for the last 10 seconds */
.pz-st,.pz-el{font-size:13px;color:var(--muted);text-align:center}
.pz-chk{white-space:nowrap}
@media (max-width:1100px){      /* not enough room for four columns: the athlete and Penalty Served on one line, then the times, then the countdown */
  .pzrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who served" "box box" "timer timer"}
  .pz-who{grid-area:who;min-width:0}
  .pz-n{grid-area:served}
  .pz-box{grid-area:box}
  .pz-t{grid-area:timer;display:flex;align-items:center;justify-content:flex-start;gap:12px;min-height:0}
  .pz-t:empty{display:none}
  .pz-st,.pz-el{text-align:left}
  .pz-box .pz-tfld{flex:1 1 0;min-width:0}
}
@media (max-width:720px){       /* phones: the athlete gets the full width, the countdown and Penalty Served share the last line */
  .pzrow{grid-template-areas:"who who" "box box" "timer served"}
}
@media (max-width:480px){
  .pzrow{grid-template-columns:minmax(0,1fr);grid-template-areas:"who" "box" "timer" "served"}
  .pz-box{flex-direction:column}
  .pz-box .pz-tfld{flex:none;width:100%}
  .pz-n .chk{width:100%}
}
}
.jn.ac{font-size:26px}
.jchip.ac{font-size:11px;letter-spacing:-.03em;padding:0 2px}
.jrow.ac{grid-template-columns:minmax(240px,1.3fr) minmax(200px,1fr)}
.jrow.ac.has-dn{border-left-color:var(--ink)}
.acm{display:inline-block;padding:0 5px;margin-right:4px;border-radius:4px;background:var(--ink);color:var(--bg);font:700 11px/16px system-ui,sans-serif;vertical-align:1px}
.pchip .acm{background:var(--bg);color:var(--ink);margin:0 0 0 4px}
.dni{display:block;white-space:nowrap}
.acn{display:block;margin-top:4px;color:var(--muted);font-size:13px}
.acnp{white-space:nowrap;margin-right:8px}
.jp-note{margin:8px 0 0;color:var(--muted);font-size:14px;max-width:72ch}
.banner{margin:0 0 12px;padding:10px 14px;border-left:5px solid var(--off-ink);background:var(--off-bg);color:var(--ink);border-radius:4px;font-weight:500}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.toolbar .sp{flex:1}
.warn{margin:0 0 10px;padding:8px 12px;border-left:5px solid var(--yellow);background:var(--yellow-soft);color:var(--yellow-ink);border-radius:4px;font-weight:500}
.warn[hidden]{display:none}

.band{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.fields + .fields{margin-top:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 16px}
.field label{display:block;font-weight:600;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;height:42px;padding:0 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
.field input[disabled]{background:var(--surface-2)}

/* ---------- Matrix (Recorder + Red Cards) ---------- */
.mx-wrap{overflow:auto;max-height:calc(100vh - 110px);max-height:var(--wrap-h,calc(100dvh - 110px));border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.mx{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;font-size:14px}
.mx th,.mx td{padding:0 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-weight:400}
.mx tbody td{height:38px}
.mx thead th{position:sticky;z-index:3;font-size:12.5px;font-weight:600;color:var(--muted)}
.mx thead tr.r1 th{top:0;height:var(--h1)}
.mx thead tr.r2 th{top:var(--h1);height:var(--h2)}
.mx thead tr.r3 th{top:calc(var(--h1) + var(--h2));height:var(--h3)}
.mx thead tr.r4 th{top:calc(var(--h1) + var(--h2) + var(--h3));height:var(--h4);border-bottom:2px solid var(--ink)}
.mx th.lab{text-align:right;padding-right:10px}
.mx .l1,.mx .l2{position:sticky}
.mx.nohip .l2{left:0}
.mx .l1{left:0} .mx .l2{left:var(--w-hip)}
.mx tbody td.l1,.mx tbody td.l2,.mx tbody td.l3,.mx tbody td.l4{z-index:2}
.mx thead th.l1,.mx thead th.l2,.mx thead th.l3,.mx thead th.l4,.mx thead th.lab{z-index:5}
@media (min-width:900px){
  .mx .l3,.mx .l4,.mx th.lab{position:sticky}
  .mx .l3{left:calc(var(--w-hip) + var(--w-bib))}
  .mx .l4{left:calc(var(--w-hip) + var(--w-bib) + var(--w-name))}
  .mx th.lab{left:0}
  .mx td.tlab{left:0}
  .mx .l4{border-right:2px solid var(--ink)}

      img += '"';
      img += '\u0020height="';

/* ---------- Tabs ---------- */
function usePZ(){ return S.event.usePZ === true; }

/* ---------- Penalty Zone ----------
   Kept with the Penalty Zone Manager's entries (position 12), so the Recorder and the PZM can both use the tab and every device sees it.
   Each athlete's entry holds when they arrived (pza) and when they were released (pzr), as milliseconds, how long their penalty is
   (pzd, seconds, fixed when they arrive) and whether it is marked served (pzv). The penalty time chosen for the race is kept under a
   reserved key. Time left is worked out from the device clock, so it is never stored. */
var PZ_KEY = '_pz', PZ_TIMES = [30, 60, 120, 180, 240, 300];

// wait: not arrived. run: counting down. time: time is up, not released. rel: released, not marked served. served.
function pzState(aid, now){

  var state = served ? 'served' : r ? 'rel' : !a ? 'wait' : (end && end <= now) ? 'time' : 'run';
  return {state:state, a:a, r:r, d:d, end:end, left:end ? end - now : 0, served:served};
}
function pzServed(aid){ return usePZ() && !!getEntry(PZM, aid).pzv; }
function pzFmt(ms){ var t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2); }
function pzDur(ms){ var t = Math.max(0, Math.floor(ms / 1000)); return Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2); }
function pzLabel(sec){ return sec < 60 ? sec + ' seconds' : (sec / 60) + (sec === 60 ? ' minute' : ' minutes'); }
function pzClock(ms){ var d = new Date(+ms); function p(n){ return ('0' + n).slice(-2); } return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
// A typed time (H MM, HHMM or HHMMSS, colons allowed) as today's date at that time. 0 = empty, -1 = not a time.
function pzParse(txt){
  var t = str(txt).replace(/\D/g, ''), h, m, sec = 0;
  if (!t) return 0;
  if (t.length === 3) { h = +t.slice(0, 1); m = +t.slice(1); }
  else if (t.length === 4) { h = +t.slice(0, 2); m = +t.slice(2); }
  else if (t.length === 6) { h = +t.slice(0, 2); m = +t.slice(2, 4); sec = +t.slice(4); }

function pzAthletes(){
  var pit = S.event.pit, now = Date.now(), out = [];
  S.event.athletes.forEach(function(a, i){
    var c = redCount(a.id), st = pzState(a.id, now);
    if ((pit > 0 && c >= pit) || st.a || st.r || st.served) out.push({a:a, c:c, st:st, i:i, dq:status(c, a.id) === 'dq'});

/* ---------- Matrix (shared by Recorder and Red Cards) ---------- */
/* ---- totals for the Recorder: each yellow paddle type and each red card type per judge, and all red cards in the race ---- */
function judgeTotals(n){
  var t = {y1:0, y2:0, gt:0, tl:0, lgt:0, ltl:0};
  S.event.athletes.forEach(function(a){
    var e = getEntry(n, a.id);
    if (e.y1) t.y1++;
    if (e.y2) t.y2++;
    if (e.rc === '>') t.gt++; else if (e.rc === '~') t.tl++;
    if (n === 1 && l100On()) { if (e.lc === '>') t.lgt++; else if (e.lc === '~') t.ltl++; }
  });
  return t;
}
function raceRedTotal(){ return S.event.athletes.reduce(function(m, a){ return m + redCount(a.id); }, 0); }
// DQ notifications shown with the Chief Judge's: their own, plus any entered by AC1 or AC2, each marked with who it came from.
function dnItems(aid, own){
  var out = [];
  if (own && own.dn) out.push({who:'', t:own.dn});
  for (var n = NMAIN + 1; n <= NMAIN + NAC; n++) { if (!isActive(n)) continue; var e = getEntry(n, aid); if (e.dn) out.push({who:jtag(n), t:e.dn}); }
  return out;
}
function dnText(aid, own){ return dnItems(aid, own).map(function(i){ return i.who ? i.t + ' (' + i.who + ')' : i.t; }).join('; '); }
function dnCellHTML(items){ return items.map(function(i){ return '<span class="dni">' + (i.who ? '<span class="acm">' + i.who + '</span>' : '') + '<span class="tm">' + esc(i.t) + '</span></span>'; }).join(''); }
function acNoteHTML(aid){
  var it = dnItems(aid, null);
  return it.length ? '<span class="acn" title="DQ notifications entered by the assistant chief judges">' + it.map(function(i){ return '<span class="acnp"><span class="acm">' + i.who + '</span>' + esc(i.t) + '</span>'; }).join(' ') + '</span>' : '';
}
function gridCell(t, e, g, first, aid){
  var v = e[t === 'rc100' ? 'rc' : t], on = v ? (t === 'y1' || t === 'y2' ? 'on-y' : 'on-r') : '', inner = '';
  if (v) inner = (t === 'rc' || t === 'rc100' || t === 'lc') ? '<span class="chip-rc">' + esc(v) + '</span>' : '<span class="tm">' + esc(v) + '</span>';
  if (t === 'dn' && aid) { var di = dnItems(aid, e); on = di.length ? 'on-r' : ''; inner = dnCellHTML(di); }
  return '<td class="' + (first ? 'jstart' + g + (on ? ' ' + on : '') : (on || g.trim())) + '">' + inner + '</td>';
}
function matrixHTML(mode, rows, emptyMsg){
  var ev = S.event, edit = mode === 'rec' && !ro(), dis = ro() ? ' disabled' : '';
  var act = activeList();                            // judges that are off are not drawn at all
  var spec = act.map(function(n){ return judgeCols(n, mode); });   // each judge's own columns
  var ncols = spec.reduce(function(a, x){ return a + x.length; }, 0);
  var hip = useHip(), bib = useBib(), nid = idCount();     // athlete identification columns that are switched on
  var cols = (hip ? '<col style="width:var(--w-hip)">' : '') + (bib ? '<col style="width:var(--w-bib)">' : '') + '<col style="width:var(--w-name)"><col style="width:var(--w-cnt)">';
  spec.forEach(function(sp){ sp.forEach(function(t){ cols += '<col style="width:var(--w-' + COLS[t].w + ')">'; }); });

  var r1 = '<tr class="r1"><th class="lab" colspan="' + (nid + 1) + '">Judge number</th><th class="l4">Recorder</th>';
  var r2 = '<tr class="r2"><th class="lab" colspan="' + (nid + 1) + '">Judge name</th><th class="l4 recname" title="' + esc(ev.recorder) + '">' + (esc(ev.recorder) || '&nbsp;') + '</th>';
  var r3 = '<tr class="r3"><th class="lab" colspan="' + (nid + 1) + '">Cert # &amp; level</th><th class="l4" title="' + esc(ev.recorderCert) + '">' + esc(ev.recorderCert) + '</th>';
  var r4 = '<tr class="r4">' + (hip ? '<th class="l1">Hip #</th>' : '') + (bib ? '<th class="l2">Bib #</th>' : '') + '<th class="l3">Athlete name</th><th class="l4 rc-h">Red cards</th>';
  act.forEach(function(n, idx){
    var ga = idx % 2 === 1 ? ' ga' : '', j = ev.judges[n - 1], sp = spec[idx];
    r1 += '<th colspan="' + sp.length + '" class="jh jstart' + ga + '"><span class="jnum">' + n + '</span>' + (n === 1 ? '<span class="role">Chief</span>' : '') + '</th>';
    r2 += '<th colspan="' + sp.length + '" class="recname jstart' + ga + '" title="' + esc(j.name) + '">' + esc(j.name) + '</th>';
    r3 += '<th colspan="' + sp.length + '" class="jstart' + ga + '" title="' + esc(j.cert) + '">' + esc(j.cert) + '</th>';
    sp.forEach(function(t, ti){
      r4 += '<th class="' + COLS[t].cls + (ti === 0 ? ' jstart' + ga : (t === 'rt' ? ga : '')) + '">' + COLS[t].h.replace('>', '&gt;') + '</th>';
    });

  var body = '';
  if (!rows.length) {
    body = '<tr><td class="empty-cell" colspan="' + (nid + 2 + ncols) + '"><div class="empty-in">' + emptyMsg + '</div></td></tr>';
  } else rows.forEach(function(r){
    var a = r.a, c = r.c, st = status(c, a.id);
    var cls = (c > 0 ? 'has-rc' : '') + (st ? ' st-' + st : '');
    var tds = '';
    if (edit) {
      if (hip) tds += '<td class="l1"><input class="cin c" data-bind="ath" data-aid="' + a.id + '" data-k="hip" data-f="ath:' + a.id + ':hip" value="' + esc(a.hip) + '" placeholder="Hip" aria-label="Hip or lane number"></td>';
      if (bib) tds += '<td class="l2"><input class="cin c" data-bind="ath" data-aid="' + a.id + '" data-k="bib" data-f="ath:' + a.id + ':bib" value="' + esc(a.bib) + '" placeholder="Bib" aria-label="Bib number"></td>';
      tds += '<td class="l3"><div class="namecell"><input class="cin" data-bind="ath" data-aid="' + a.id + '" data-k="name" data-f="ath:' + a.id + ':name" value="' + esc(a.name) + '" placeholder="Athlete name" aria-label="Athlete name">' +
            '<button class="xbtn" data-act="del-athlete" data-aid="' + a.id + '" data-f="del:' + a.id + '" aria-label="Remove athlete ' + esc(athLabel(a)) + '"' + dis + '>' + ICON_X_SM + '</button></div></td>';
    } else {
      if (hip) tds += '<td class="l1 tm">' + esc(a.hip) + '</td>';
      if (bib) tds += '<td class="l2 tm">' + esc(a.bib) + '</td>';
      tds += '<td class="l3" title="' + esc(a.name) + '"><span class="nm">' + esc(a.name) + '</span></td>';
    }
    tds += '<td class="l4 cnt' + (c ? '' : ' zero') + '"><b>' + c + '</b>' + stChips(a.id, st) + '</td>';
    act.forEach(function(n, idx){
      var e = getEntry(n, a.id), g = idx % 2 === 1 ? ' ga' : '';
      spec[idx].forEach(function(t, ti){ tds += gridCell(t, e, g, ti === 0, a.id); });
    });
    body += '<tr class="' + cls + '">' + tds + '</tr>';
  });
  var foot = '';
  if (mode === 'rec' && rows.length) {
    foot = '<tfoot><tr class="tot"><td class="tlab" colspan="' + (nid + 1) + '">Totals</td>' +
      '<td class="l4 cnt" title="All red cards in this race"><b>' + raceRedTotal() + '</b></td>';
    act.forEach(function(n, idx){
      var t = judgeTotals(n);
      spec[idx].forEach(function(c, ti){
        var first = ti === 0 ? ' jstart' : '';
        if (c === 'y1' || c === 'y2') foot += '<td class="tt' + first + '" title="' + (c === 'y1' ? 'Yellow &gt;' : 'Yellow ~') + ' paddles"><b class="' + (t[c] ? '' : 'z') + '">' + t[c] + '</b></td>';
        else if (c === 'rc' || c === 'rc100' || c === 'lc') { var tg = c === 'lc' ? t.lgt : t.gt, tt = c === 'lc' ? t.ltl : t.tl; foot += '<td class="tt' + first + '" title="' + (c === 'lc' ? 'Last 100m red cards' : 'Red cards') + ' by type"><span class="tg"><i>&gt;</i><b class="' + (tg ? '' : 'z') + '">' + tg + '</b></span><span class="tg"><i>~</i><b class="' + (tt ? '' : 'z') + '">' + tt + '</b></span></td>'; }
        else foot += '<td class="tt' + first + '"></td>';
      });
    });
    foot += '</tr></tfoot>';
  }
  return '<div class="mx-wrap"><table class="mx' + (hip ? '' : ' nohip') + (bib ? '' : ' nobib') + '"><colgroup>' + cols + '</colgroup>' + head + '<tbody>' + body + '</tbody>' + foot + '</table></div>';
}

function jlabel(n){ return S.event.judges[n - 1].name || ('Judge ' + n); }
function judgeLines(a, showY){
  var out = '';

    var e = getEntry(n, a.id), chips = '', chief = chiefSheet(n);
    if (showY && !chief && e.y1) chips += '<span class="pchip y">Yellow &gt; ' + esc(e.y1) + '</span>';
    if (showY && !chief && e.y2) chips += '<span class="pchip y">Yellow ~ ' + esc(e.y2) + '</span>';
    if (e.rc) chips += '<span class="pchip r">' + (chief ? 'Last 100m red card ' : 'Red card ') + esc(e.rc) + (e.rt ? ' ' + esc(e.rt) : '') + '</span>';

  function drawTotals(y, grp){

      specFor(n).forEach(function(c){

async function exportPDF(kind, paper){
  if (!dl) return;
  var JS;
  try { JS = await ensurePDF(); }
  catch (err) { toast('The PDF tool could not load. Check the connection and try again.'); return; }
  var doc;
  try { doc = buildPDF(JS, kind, paper); }
  catch (err) { toast('Could not build the PDF.'); try { console.error(err); } catch (x) {} return; }
  var ev = S.event;
  var fname = 'race-walk-' + (kind === 'rc' ? 'red-cards' : 'recorder') + '-' + (ev.name || 'meet').replace(/[^\w.-]+/g, '-') + (inHeats() ? '-' + raceLabel(S.raceId).replace(/[^\w.-]+/g, '-') : '') + (ev.date ? '-' + ev.date : '') + '.pdf';
  try { await dl.save({filename:fname, data:doc.output('arraybuffer')}); toast('PDF ready.'); }
  catch (err) { if (!err || err.code !== 'declined') toast('Could not export the PDF in this view.'); }
}
function openPdfDialog(kind){
  var isRC = kind === 'rc';
  openDialog({
    title:'Export ' + (isRC ? 'Red Cards' : 'Recorder') + ' as PDF',
    body:'<p>Choose a page size. Both are landscape.</p>' +
      '<label class="opt"><input type="radio" name="pdfpaper" value="letter" checked><span><b>Letter, 8.5 &times; 11 in</b><br>' +
        (isRC ? 'All active judges fit across one page.' : 'Judges are split across pages when there are more than four, with the athlete columns repeated on each.') + '</span></label>' +
      '<label class="opt"><input type="radio" name="pdfpaper" value="tabloid"><span><b>Tabloid, 11 &times; 17 in</b><br>' +
        (isRC ? 'Larger columns that are easier to read from a distance.' : 'All active judges on one page width, like the app.') + '</span></label>' +
      (isRC && (S.rcOnly || S.rcSort === 'cards') ? '<p>The PDF matches what the tab is showing now, including its sort and filter.</p>' : ''),
    ok:'Export PDF',
    onOk:function(){ var r = document.querySelector('input[name="pdfpaper"]:checked'); exportPDF(kind, r ? r.value : 'letter'); }

}

document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b || b.disabled) return;
  var act = b.dataset.act;
  switch (act) {
    case 'tab': go(b.dataset.tab); break;
    case 'dlg-cancel': closeDialog(); break;
    case 'dlg-ok': { var f = dlg && dlg.onOk; var keep = f ? f() === false : false; if (!keep) closeDialog(); break; }
    case 'add-athlete': if (!ro()) addAthlete(true); break;
    case 'del-athlete': {
      if (ro()) break;
      var id = b.dataset.aid, a = findAth(id);
      if (athHasEntries(id)) confirmDlg('Remove athlete?', 'Remove ' + esc(a ? athLabel(a) : 'this athlete') + '? Their paddles and red cards from every judge are removed too.', 'Remove athlete', function(){ delAthlete(id); });
      else delAthlete(id);
      break;
    }
    case 'paste': if (!ro()) openPaste(); break;
    case 'sample':
      if (ro()) break;
      if (S.event.athletes.length || hasAnyEntries()) confirmDlg('Replace with sample race?', 'This replaces the athletes, officials and every judge&rsquo;s entries' + (inHeats() ? ' for ' + esc(raceLabel(S.raceId)) : '') + ' on all devices with a sample race.', 'Load sample', loadSample);
      else loadSample();
      break;
    case 'clear-all':
      if (ro()) break;
      confirmDlg('Clear all judge entries?', 'This clears every judge&rsquo;s paddles and red cards, and any Penalty Zone countdowns, for all athletes' + (inHeats() ? ' in ' + esc(raceLabel(S.raceId)) + ' only' : '') + ', on every device. Use it before a new race. The athletes and officials stay.', 'Clear entries', clearAll);
      break;
    case 'clear-judge': {
      if (roEnt()) break;
      var n = +b.dataset.n;
      confirmDlg('Clear your entries?', 'This clears every yellow paddle and red card you recorded as Judge ' + n + '.', 'Clear my entries', function(){ clearJudge(n); });
      break;
    }
    case 'csv': exportCSV(); break;
    case 'pdf': openPdfDialog(b.dataset.k); break;
    case 'rc-sort': S.rcSort = b.dataset.v; render(); break;
    case 'rc-only': S.rcOnly = !S.rcOnly; render(); break;
    case 'pz-time': {
      if (roEnt()) break;
      ent(PZM, PZ_KEY).pzd = String(+b.dataset.v || 0);
      queueEntries(PZM, 100); render();
      break;
    }
    case 'pz-stamp': {
      if (roEnt()) break;
      var pza = b.dataset.aid, pzk = b.dataset.k, pze = ent(PZM, pza), pzn = Date.now();

        } else pzRelease(pza, pzn);

    }
    case 'pz-served': {
      if (roEnt()) { b.checked = !b.checked; break; }

      qel.focus(); qel.select();
      var done = function(){ toast('Link copied.'); }, fail = function(){ toast('Select the link and copy it.'); };
      try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(qel.value).then(done, function(){ try { document.execCommand('copy') ? done() : fail(); } catch(e){ fail(); } }); else document.execCommand('copy') ? done() : fail(); }
      catch (e) { fail(); }
      break;
    }
    case 'new-codes':
      if (ro()) break;
      confirmDlg('Create new codes?', 'This replaces the code for all nine judges. Every earlier QR code and typed code stops working, including on devices that are using one now.', 'Create new codes', function(){ replaceCodes(); render(); toast('New codes created.'); });
      break;
    case 'import-pick': { var pf = $('#imp-file'); if (pf) pf.click(); break; }
    case 'export-meet': exportMeet(); break;
    case 'signup': signUp(); break;
    case 'send-link': {
      var em = ($('#si-email') || {}).value || ''; em = em.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { toast('Enter a valid email address.'); break; }
      U.auth.sendLink(em).then(function(){ S.linkSent = em; render(); }, function(){ toast('The email could not be sent. Check the address and try again.'); });
      break;
    }
    case 'link-again': S.linkSent = ''; render(); break;
    case 'sign-out': signOutNow(); break;
    case 'new-meet': if (S.canWrite) openNewMeetDialog(); break;
    case 'open-meet': if (S.acct) { LS.set(KEY + 'official', ''); openMeet(S.acct.uid, b.dataset.id); } break;
    case 'home': if (S.acct) goHome(); break;
    case 'archive-meet': case 'restore-meet': {
      var lm = S.meets.filter(function(m){ return m.id === b.dataset.id; })[0]; if (!lm || !S.canWrite) break;
      if (b.dataset.act === 'restore-meet') { setListedArchived(lm, false); break; }
      confirmDlg('Archive ' + (lm.name || 'this meet') + '?', 'It moves to Archived meets and becomes read-only for everyone, including officials. You can restore it at any time.', 'Archive meet', function(){ setListedArchived(lm, true); });
      break;
    }
    case 'archive-current': confirmDlg('Archive this meet?', 'It moves to Archived meets and becomes read-only for everyone, including officials. You can restore it at any time.', 'Archive meet', function(){ setCurrentArchived(true); }); break;
    case 'restore-current': setCurrentArchived(false); break;
    case 'import-legacy': importLegacy(); break;
    case 'race-status': setRaceStatus(b.dataset.v); break;
    case 'race': selectRace(b.dataset.id); break;
    case 'copy-race': {
      if (ro()) break;
      var src = S.copySrc;
      if (!validRace(src)) { toast('Choose a race to copy from.'); break; }
      confirmDlg('Copy from ' + raceLabel(src) + '?', 'This replaces the recorder, officials, judges on or off and red card counts for ' + esc(raceLabel(S.raceId)) + ' with those from ' + esc(raceLabel(src)) + '. Athletes and judge entries are not changed.', 'Copy', function(){ copyRace(src); });
      break;
    }
    case 'supervisory': {
      if (ro()) break;
      S.event.supervisory = !S.event.supervisory;
      if (S.event.supervisory) S.event.last100 = false;      // the last 100m card is only a separate option for a Chief Judge who is judging
      queueRace(200); render();
      b.checked = S.event.supervisory;
      break;
    }
    case 'last100': {
      if (ro() || isSupervisory()) { b.checked = l100On(); break; }
      S.event.last100 = !S.event.last100;
      queueRace(200); render();
      b.checked = l100On();
      break;
    }
    case 'toggle-judge': {
      if (ro()) break;
      var tn = +b.dataset.n;
      if (isPZM(tn) && !usePZ()) break;                  // needs Penalty Zone turned on first
      S.event.active[tn - 1] = isPZM(tn) ? S.event.active[tn - 1] !== true : !isActive(tn);
      queueRace(200); render();
      break;
    }
    case 'stamp': {
      if (roEnt() || !isActive(+b.dataset.n) || !raceOpen()) break;
      var jn = +b.dataset.n, en = ent(jn, b.dataset.aid), k = b.dataset.k;
      en[k] = en[k] ? '' : nowNum();
      queueEntries(jn, 120); render();
      break;
    }
    case 'rc': {
      if (roEnt() || !isActive(+b.dataset.n) || !raceOpen()) break;
      var jn2 = +b.dataset.n;
      ent(jn2, b.dataset.aid)[b.dataset.k === 'lc' ? 'lc' : 'rc'] = b.dataset.v;
      queueEntries(jn2, 120); render();
      break;
    }
  }
});

document.addEventListener('input', function(e){
  var t = e.target;
  if (t.dataset && t.dataset.bind === 'pz') return;              // Penalty Zone times are committed when the box is left
  if (t.id === 'jq') { S.filter = t.value; renderJudgeList(); return; }
  var b = t.dataset && t.dataset.bind;
  if (!b || (b === 'ent' ? roEnt() : ro())) return;
  var k = t.dataset.k;
  if (b === 'ev') {
    if (k === 'dq' || k === 'pit' || k === 'divCount') return;           // handled on change
    S.event[k] = t.value; qEv(k, 500);
    if (k === 'name' || k === 'date') renderHeader();
  } else if (b === 'div') {
    if (k === 'name') { S.event.divisions[+t.dataset.i].name = t.value; queueMeet(500); renderRaceBar(); }   // heats handled on change
  } else if (b === 'jd') {
    S.event.judges[+t.dataset.n - 1][k] = t.value; queueRace(500);
  } else if (b === 'ath') {
    var a = findAth(t.dataset.aid);
    if (a) { a[k] = t.value; queueRace(500); updateWarn(); }
  } else if (b === 'ent') {
    var n = +t.dataset.n, v = digits(t.value);
    if (!isActive(n) || !raceOpen()) return;
    if (v !== t.value) t.value = v;
    ent(n, t.dataset.aid)[k] = v;
    queueEntries(n, 500); refreshRow(t);
  }
});

document.addEventListener('change', function(e){
  var t = e.target;
  if (t.id === 'imp-file') { importFile(t); return; }
  if (t.dataset && t.dataset.bind === 'pz') { pzTyped(t); return; }
  if (t.dataset && t.dataset.bind === 'copysrc') { S.copySrc = t.value; return; }
  if (t.dataset && t.dataset.bind === 'divsel' && !ro()) {
    var dv = S.event.divisions[+t.dataset.i], pickv = t.value;
    if (pickv === '__custom__') dv.custom = true; else { dv.name = pickv; dv.custom = false; }
    queueMeet(200); render();
    if (pickv === '__custom__') { var ce = document.querySelector('[data-f="div:' + t.dataset.i + ':name"]'); if (ce) ce.focus(); }
    return;
  }
  if (t.dataset && t.dataset.bind === 'div' && t.dataset.k === 'heats' && !ro()) {
    S.event.divisions[+t.dataset.i].heats = toInt(t.value, 1, MAXHEATS, 1);
    t.value = S.event.divisions[+t.dataset.i].heats; queueMeet(200);
    if (!syncRace()) render();
    return;
  }
  if (!t.dataset || t.dataset.bind !== 'ev' || ro()) return;
  if (t.dataset.k === 'shareLink') { render(); return; }      // shows or clears the "not a web link" note
  if (t.dataset.k === 'divCount') { S.event.divCount = toInt(t.value, 1, MAXDIV, 2); t.value = S.event.divCount; queueMeet(200); if (!syncRace()) render(); return; }
  if (t.dataset.k === 'dq') { S.event.dq = toInt(t.value, 1, 9, 3); queueRace(200); render(); }
  else if (t.dataset.k === 'pit') { S.event.pit = toInt(t.value, 0, 9, 0); queueRace(200); render(); }
});

document.addEventListener('keydown', function(e){
  var t = e.target;
  if (e.key === 'Escape' && dlg) { closeDialog(); return; }
  if (e.key === 'Tab' && dlg) {
    var f = $('#dialog-root').querySelectorAll('button, textarea, input');
    if (f.length) {
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  if (e.key === 'Enter' && t.dataset && t.dataset.bind === 'ath' && t.dataset.k === 'name' && !ro()) {
    var i = -1;
    S.event.athletes.forEach(function(a, idx){ if (a.id === t.dataset.aid) i = idx; });
    if (i === S.event.athletes.length - 1) { e.preventDefault(); addAthlete(true); }
  }
  if (e.key === 'Enter' && t.classList && t.classList.contains('tin')) t.blur();
});

window.addEventListener('hashchange', function(){
  var po = parseOfficial((location.hash || '').slice(1));
  if (po) { acceptOfficial(po); return; }
  var h = (location.hash || '').slice(1).split('/');
  if (h[1] && validRace(h[1]) && h[1] !== wantRace) { wantRace = h[1]; LS.set(KEY + 'race', wantRace); syncRace(); }
  if (h[0] && h[0] !== S.tab) go(h[0], true);
});
document.addEventListener('visibilitychange', function(){ if (document.hidden) flushAll(); });
window.addEventListener('pagehide', flushAll);
window.addEventListener('resize', fitGrid);

/* ================================================================
   Start
   ================================================================ */
(function init(){
  var h = ''; try { h = (location.hash || '').slice(1); } catch(e){}
  var saved = LS.get(KEY + 'tab');
  var hp = h.split('/'), po = parseOfficial(h);
  S.tab = validTab(hp[0]) ? hp[0] : validTab(saved) ? saved : 'howto';
  wantRace = hp[1] || LS.get(KEY + 'race');
  if (po) { S.pendingOff = po; S.tab = tabFor(po.n); if (po.race) wantRace = po.race; }   // opened from a judge's QR code
  try {
    var mq = window.matchMedia('(max-width: 720px)');
    S.narrow = mq.matches;
    var onMq = function(e){ S.narrow = e.matches; render(); };
    if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
  } catch(e){}
  render();
  connect();
})();

})();
</script>
</body>
</html>
